a<\u002Fh3>\n          <p style=\"color: var(--dgo-color-fg-muted); font-size: var(--dgo-type-body-sm);\">Duba bayananka kafin tura. Za ka karɓi tabbatarwa ta imel.<\u002Fp>\n          <button class=\"dgo-btn dgo-btn--primary\" style=\"margin-top: 12px;\">Tura<\u002Fbutton>\n        <\u002Fdiv>\n        <div>\n          <div class=\"dgo-overline\">ig (Igbo)<\u002Fdiv>\n          <h3 style=\"margin: 4px 0 8px;\">Zigaa arịrịọ gị<\u002Fh3>\n          <p style=\"color: var(--dgo-color-fg-muted); font-size: var(--dgo-type-body-sm);\">Lelee nkọwa gị tupu ị zigaa. Ị ga-anata nkwenye site na ozi-e.<\u002Fp>\n          <button class=\"dgo-btn dgo-btn--primary\" style=\"margin-top: 12px;\">Zigaa<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3>RTL stress<\u002Fh3>\n      <div class=\"doc-panel\" dir=\"rtl\" lang=\"ar\">\n        <div class=\"dgo-row dgo-row--between\">\n          <button class=\"dgo-btn dgo-btn--primary\"><svg class=\"icon-sm\"><use href=\"b3aa3f04-1df3-4e47-be12-707d6d29c77c#i-arrow-right\"><\u002Fuse><\u002Fsvg>إرسال الطلب<\u002Fbutton>\n          <span class=\"dgo-pill dgo-pill--replied\"><span class=\"dgo-pill__dot\"><\u002Fspan>تمت الموافقة<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin-top: var(--dgo-s-4); color: var(--dgo-color-fg-muted);\">جميع الخصائص المنطقية (logical properties) تعكس الاتجاه تلقائياً.<\u002Fp>\n      <\u002Fdiv>\n\n      <h3>Locale formatting<\u002Fh3>\n      <div class=\"doc-panel\">\n        <table class=\"dgo-table\">\n          <thead><tr><th>Format<\u002Fth><th>Pattern<\u002Fth><th>Example<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td>Currency<\u002Ftd><td>₦ XXX,XXX.XX<\u002Ftd><td class=\"dgo-table__num\">₦ 18,400,000.00<\u002Ftd><\u002Ftr>\n            <tr><td>Date — short<\u002Ftd><td>DD MMM YYYY<\u002Ftd><td>18 May 2026<\u002Ftd><\u002Ftr>\n            <tr><td>Date — long<\u002Ftd><td>EEEE, DD MMMM YYYY<\u002Ftd><td>Monday, 18 May 2026<\u002Ftd><\u002Ftr>\n            <tr><td>Time — 24h (default)<\u002Ftd><td>HH:mm WAT<\u002Ftd><td>14:32 WAT<\u002Ftd><\u002Ftr>\n            <tr><td>Time — 12h<\u002Ftd><td>h:mm a<\u002Ftd><td>2:32 pm<\u002Ftd><\u002Ftr>\n            <tr><td>Phone<\u002Ftd><td>+234 XXX XXX XXXX<\u002Ftd><td>+234 803 000 0000<\u002Ftd><\u002Ftr>\n            <tr><td>NIN<\u002Ftd><td>XXXXXXXXXXX (11 digits)<\u002Ftd><td>12345678901<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n\n    <!-- ============= ACCESSIBILITY ============= -->\n    <section id=\"a11y\" class=\"doc-section\">\n      <h2>Accessibility — WCAG 2.2 AA<\u002Fh2>\n      <div class=\"dgo-grid dgo-grid--2\">\n        <div class=\"dgo-card\">\n          <h3 class=\"dgo-card__title\">Focus<\u002Fh3>\n          <p style=\"color: var(--dgo-color-fg-muted); font-size: var(--dgo-type-body-sm);\">3px Smart Green ring, 2px offset, never <code class=\"dgo-inline-code\">outline:none<\u002Fcode> without replacement.<\u002Fp>\n          <div style=\"margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap;\">\n            <button class=\"dgo-btn dgo-btn--primary\" style=\"box-shadow: var(--dgo-focus-ring);\">Focused button<\u002Fbutton>\n            <input class=\"dgo-input\" style=\"box-shadow: 0 0 0 3px color-mix(in srgb, var(--dgo-color-action-primary) 22%, transparent); border-color: var(--dgo-color-action-primary); width: 200px;\" value=\"Focused input\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"dgo-card\">\n          <h3 class=\"dgo-card__title\">Targets<\u002Fh3>\n          <p style=\"color: var(--dgo-color-fg-muted); font-size: var(--dgo-type-body-sm);\">≥ 24×24 CSS px desktop · ≥ 44×44 touch. Tabs sit at 40px, primary buttons at 40px, sm at 32px (with adequate spacing).<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"dgo-card\">\n          <h3 class=\"dgo-card__title\">Semantics<\u002Fh3>\n          <p style=\"color: var(--dgo-color-fg-muted); font-size: var(--dgo-type-body-sm);\">Buttons are <code class=\"dgo-inline-code\">&lt;button&gt;<\u002Fcode>. Tabs use <code class=\"dgo-inline-code\">role=\"tab\"<\u002Fcode> + <code class=\"dgo-inline-code\">aria-selected<\u002Fcode>. Form errors use <code class=\"dgo-inline-code\">aria-invalid<\u002Fcode> + <code class=\"dgo-inline-code\">aria-describedby<\u002Fcode>. Toasts use <code class=\"dgo-inline-code\">role=\"status\"<\u002Fcode>.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"dgo-card\">\n          <h3 class=\"dgo-card__title\">Reduced motion<\u002Fh3>\n          <p style=\"color: var(--dgo-color-fg-muted); font-size: var(--dgo-type-body-sm);\"><code class=\"dgo-inline-code\">prefers-reduced-motion: reduce<\u002Fcode> collapses every motion token to ≤ 50ms. No transform animations on critical paths.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n\n    <!-- ============= COMMAND PALETTE (v2.1) ============= -->\n    <section id=\"cmdk\" class=\"doc-section\">\n      <h2>Command Palette <span class=\"dgo-badge dgo-badge--neutral\" style=\"vertical-align: middle; font-weight: var(--dgo-wt-600);\">v2.1 · interactive<\u002Fspan><\u002Fh2>\n      <p>The first <em>worked example<\u002Fem> against §11. WAI-ARIA APG 1.2 combobox with <code class=\"dgo-inline-code\">aria-activedescendant<\u002Fcode>; the input keeps focus while the active row moves. <strong>Try it:<\u002Fstrong> <code class=\"dgo-inline-code\">Ctrl<\u002Fcode> + <code class=\"dgo-inline-code\">K<\u002Fcode> (or <code class=\"dgo-inline-code\">⌘<\u002Fcode> + <code class=\"dgo-inline-code\">K<\u002Fcode>) anywhere on this page.<\u002Fp>\n      <a class=\"doc-xref\" href=\"docs/components/command-palette.md\">Full component contract <code>docs/components/command-palette.md<\u002Fcode><\u002Fa>\n\n      <div class=\"dgo-grid dgo-grid--3\" style=\"margin-block: var(--dgo-s-5) var(--dgo-s-4);\">\n        <div class=\"dgo-card\">\n          <h3 class=\"dgo-card__title\">Keyboard map<\u002Fh3>\n          <ul style=\"color: var(--dgo-color-fg-muted); font-size: var(--dgo-type-body-sm); padding-inline-start: 1.2em; margin: 0; line-height: 1.7;\">\n            <li><kbd class=\"dgo-kbd\">Ctrl<\u002Fkbd>+<kbd class=\"dgo-kbd\">K<\u002Fkbd> — open<\u002Fli>\n            <li><kbd class=\"dgo-kbd\">↑<\u002Fkbd> <kbd class=\"dgo-kbd\">↓<\u002Fkbd> — navigate<\u002Fli>\n            <li><kbd class=\"dgo-kbd\">↵<\u002Fkbd> — invoke<\u002Fli>\n            <li><kbd class=\"dgo-kbd\">Esc<\u002Fkbd> — clear, then close<\u002Fli>\n            <li><kbd class=\"dgo-kbd\">Tab<\u002Fkbd> — close (deliberate)<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"dgo-card\">\n          <h3 class=\"dgo-card__title\">Why activedescendant<\u002Fh3>\n          <p style=\"color: var(--dgo-color-fg-muted); font-size: var(--dgo-type-body-sm);\">Real focus stays on the <code class=\"dgo-inline-code\">&lt;input&gt;<\u002Fcode> the entire time. Moving real focus into the listbox would break continued typing. The \"active\" row is communicated via <code class=\"dgo-inline-code\">aria-selected=\"true\"<\u002Fcode> and the input's <code class=\"dgo-inline-code\">aria-activedescendant<\u002Fcode> pointer.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"dgo-card\">\n          <h3 class=\"dgo-card__title\">Tab closes<\u002Fh3>\n          <p style=\"color: var(--dgo-color-fg-muted); font-size: var(--dgo-type-body-sm);\">A divergence from typical dialog focus-traps. A command palette is <em>transient<\u002Fem>; keyboard users expect Tab to leave the way it leaves a menu. The footer is therefore decorative — by design. See doc §9.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"demo\" style=\"position: relative; min-block-size: 380px; padding: 0; background: var(--dgo-color-surface-sunken); border: 1px solid var(--dgo-color-border-default); border-radius: var(--dgo-radius-frame); overflow: hidden;\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; padding: var(--dgo-s-3) var(--dgo-s-4); border-block-end: 1px solid var(--dgo-color-border-default); background: var(--dgo-color-surface-page);\">\n          <div style=\"display: inline-flex; align-items: center; gap: var(--dgo-s-3);\">\n            <span class=\"dgo-overline\" style=\"color: var(--dgo-color-fg-subtle);\">Demo stage<\u002Fspan>\n            <span style=\"color: var(--dgo-color-fg-muted); font-size: var(--dgo-type-body-sm);\">Press <kbd class=\"dgo-kbd\">Ctrl<\u002Fkbd>+<kbd class=\"dgo-kbd\">K<\u002Fkbd>, or<\u002Fspan>\n          <\u002Fdiv>\n          <button class=\"dgo-btn dgo-btn--secondary dgo-btn--sm\" id=\"cmdkOpen\">\n            <svg class=\"icon-sm\" aria-hidden=\"true\"><use href=\"b3aa3f04-1df3-4e47-be12-707d6d29c77c#i-search\"><\u002Fuse><\u002Fsvg>\n            Open palette\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"padding: var(--dgo-s-6); color: var(--dgo-color-fg-muted); display: grid; place-items: center; min-block-size: 320px; text-align: center;\">\n          <div>\n            <p style=\"font-size: var(--dgo-type-body-lg); color: var(--dgo-color-fg-strong); margin: 0 0 var(--dgo-s-2);\">Stage focus is anywhere on this page.<\u002Fp>\n            <p style=\"font-size: var(--dgo-type-body-sm); margin: 0;\">The palette mounts to <code class=\"dgo-inline-code\">&lt;body&gt;<\u002Fcode> and traps the <kbd class=\"dgo-kbd\">Ctrl<\u002Fkbd>+<kbd class=\"dgo-kbd\">K<\u002Fkbd> chord at capture phase.<br>It honours your current theme &amp; density picks below.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n\n    <section id=\"docs\" class=\"doc-section\">\n      <h2>Documentation<\u002Fh2>\n      <p>Every shipped artefact is paired with a doc. <strong>13 evergreen documents<\u002Fstrong> cover the foundations (cascade, tokens, color, type, spacing, motion, elevation, accessibility, i18n/RTL, content, anti-patterns) and <strong>all 27 per-component docs<\u002Fstrong> follow the §11 template. Governance, integration, and migration scaffolding live at the project root.<\u002Fp>\n\n      <!-- Roadmap meter -->\n      <div class=\"docs-meter\" role=\"group\" aria-label=\"Documentation coverage\">\n        <div class=\"docs-meter__cell\">\n          <div class=\"docs-meter__value\">12<small>/ 12<\u002Fsmall><\u002Fdiv>\n          <div class=\"docs-meter__label\">Evergreen docs<\u002Fdiv>\n          <div class=\"docs-meter__bar\"><div class=\"docs-meter__fill\" style=\"width: 100%;\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"docs-meter__cell\">\n          <div class=\"docs-meter__value\">27<small>/ 27<\u002Fsmall><\u002Fdiv>\n          <div class=\"docs-meter__label\">Per-component (§11)<\u002Fdiv>\n          <div class=\"docs-meter__bar\"><div class=\"docs-meter__fill\" style=\"width: 100%;\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"docs-meter__cell\">\n          <div class=\"docs-meter__value\">26<small>/ 26<\u002Fsmall><\u002Fdiv>\n          <div class=\"docs-meter__label\">§08 a11y contracts<\u002Fdiv>\n          <div class=\"docs-meter__bar\"><div class=\"docs-meter__fill\" style=\"width: 100%;\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"docs-meter__cell\">\n          <div class=\"docs-meter__value\">347<small>tokens<\u002Fsmall><\u002Fdiv>\n          <div class=\"docs-meter__label\">Indexed in §01<\u002Fdiv>\n          <div class=\"docs-meter__bar\"><div class=\"docs-meter__fill\" style=\"width: 100%;\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3>Evergreen documents<\u002Fh3>\n      <p style=\"margin-block-end: var(--dgo-s-4);\">Numbered, single source of truth, evolves with the system. Read in order if new to DGO.<\u002Fp>\n      <div class=\"docs-grid\">\n        <a class=\"docs-card\" href=\"docs/00-foundations.md\">\n          <span class=\"docs-card__num\">§00<\u002Fspan>\n          <span class=\"docs-card__title\">Foundations<\u002Fspan>\n          <span class=\"docs-card__desc\">Cascade diagram, layer order, BEM, theming walkthrough, reading order, floors &amp; ceilings, what's intentionally NOT in scope.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--evergreen\">Evergreen<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"docs/01-tokens.md\">\n          <span class=\"docs-card__num\">§01<\u002Fspan>\n          <span class=\"docs-card__title\">Token reference<\u002Fspan>\n          <span class=\"docs-card__desc\">Walked file-by-file. Every <code class=\"dgo-inline-code\">--dgo-*<\u002Fcode> property shipped in <code class=\"dgo-inline-code\">tokens/<\u002Fcode>, listed by tier.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--evergreen\">Evergreen<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"docs/02-color.md\">\n          <span class=\"docs-card__num\">§02<\u002Fspan>\n          <span class=\"docs-card__title\">Color<\u002Fspan>\n          <span class=\"docs-card__desc\">Real contrast matrix from the shipped palette. Known issues called out, not papered over.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--evergreen\">Evergreen<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"docs/03-typography.md\">\n          <span class=\"docs-card__num\">§03<\u002Fspan>\n          <span class=\"docs-card__title\">Typography<\u002Fspan>\n          <span class=\"docs-card__desc\">Four families, 1.200 ramp, six weights, six line-heights. Yorùbá / Hausa / Igbo risk surface per language.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--evergreen\">Evergreen<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"docs/04-spacing-grid.md\">\n          <span class=\"docs-card__num\">§04<\u002Fspan>\n          <span class=\"docs-card__title\">Spacing &amp; grid<\u002Fspan>\n          <span class=\"docs-card__desc\">4px base, density modes, the 44px touch-target floor, layout primitives.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--evergreen\">Evergreen<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"docs/05-iconography.md\">\n          <span class=\"docs-card__num\">§05<\u002Fspan>\n          <span class=\"docs-card__title\">Iconography<\u002Fspan>\n          <span class=\"docs-card__desc\">Outline-only, 1.5–2px stroke, the shipped sprite. Reading-direction icons flip under RTL.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--evergreen\">Evergreen<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"docs/06-motion.md\">\n          <span class=\"docs-card__num\">§06<\u002Fspan>\n          <span class=\"docs-card__title\">Motion<\u002Fspan>\n          <span class=\"docs-card__desc\">Duration × easing → intent. Reduced-motion is first-class at the token level. Six shipped keyframes documented.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--evergreen\">Evergreen<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"docs/07-elevation.md\">\n          <span class=\"docs-card__num\">§07<\u002Fspan>\n          <span class=\"docs-card__title\">Elevation<\u002Fspan>\n          <span class=\"docs-card__desc\">Green-tinted shadow ramp + the ten-level z-index scale. HC theme carries elevation as border, not shadow.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--evergreen\">Evergreen<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"docs/08-accessibility.md\">\n          <span class=\"docs-card__num\">§08<\u002Fspan>\n          <span class=\"docs-card__title\">Accessibility<\u002Fspan>\n          <span class=\"docs-card__desc\">Per-family keyboard + ARIA contracts for all 26 shipped component families. WCAG 2.2 AA target.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--evergreen\">Evergreen<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"docs/09-i18n-rtl.md\">\n          <span class=\"docs-card__num\">§09<\u002Fspan>\n          <span class=\"docs-card__title\">i18n &amp; RTL<\u002Fspan>\n          <span class=\"docs-card__desc\">en-NG, Yorùbá, Hausa, Igbo + RTL-prepared. Translation expansion, logical properties, locale formatting.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--evergreen\">Evergreen<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"docs/10-content-voice.md\">\n          <span class=\"docs-card__num\">§10<\u002Fspan>\n          <span class=\"docs-card__title\">Content &amp; voice<\u002Fspan>\n          <span class=\"docs-card__desc\">Federal register. Per-surface copy contracts. Error / empty recipes. House-style vocabulary.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--evergreen\">Evergreen<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"docs/11-component-template.md\">\n          <span class=\"docs-card__num\">§11<\u002Fspan>\n          <span class=\"docs-card__title\">Component template<\u002Fspan>\n          <span class=\"docs-card__desc\">The 18-section fillable shape every new component doc takes. The gate for promotion.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--evergreen\">Evergreen<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"docs/12-anti-patterns.md\">\n          <span class=\"docs-card__num\">§12<\u002Fspan>\n          <span class=\"docs-card__title\">Anti-patterns<\u002Fspan>\n          <span class=\"docs-card__desc\">Global don'ts, grounded in shipped components. The other side of the system's rules.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--evergreen\">Evergreen<\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n\n      <h3>Per-component contracts (§11 template fills)<\u002Fh3>\n      <p style=\"margin-block-end: var(--dgo-s-4);\">All 27 shipped families now carry full §11 fills — anatomy, variants, states, tokens consumed, JS contract, keyboard, ARIA, i18n, examples, anti-patterns, migration, browser support, open questions, and an owner block. Highlights below; the rest follow the same shape under <code class=\"dgo-inline-code\">docs/components/<\u002Fcode>.<\u002Fp>\n      <div class=\"docs-grid\">\n        <a class=\"docs-card\" href=\"docs/components/button.md\">\n          <span class=\"docs-card__num\">component<\u002Fspan>\n          <span class=\"docs-card__title\">Button<\u002Fspan>\n          <span class=\"docs-card__desc\">Five variants × three sizes. Loading state. The 40px-vs-44px touch-floor caveat documented. <code class=\"dgo-inline-code\">.dgo-btn-group<\u002Fcode> collapsed-border pattern.<\u002Fspan>\n          <span class=\"docs-card__tag\">v2.0 shipped<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"docs/components/input.md\">\n          <span class=\"docs-card__num\">component<\u002Fspan>\n          <span class=\"docs-card__title\">Input / Textarea / Field<\u002Fspan>\n          <span class=\"docs-card__desc\">Form-control trio. Bespoke focus halo inconsistency flagged. Per-input-type direction table for i18n.<\u002Fspan>\n          <span class=\"docs-card__tag\">v2.0 shipped<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"docs/components/tabs.md\">\n          <span class=\"docs-card__num\">component<\u002Fspan>\n          <span class=\"docs-card__title\">Tabs<\u002Fspan>\n          <span class=\"docs-card__desc\">Horizontal only. Roving-tabindex pattern. RTL arrow keys do NOT flip (per WAI-ARIA spec). No panels markup shipped.<\u002Fspan>\n          <span class=\"docs-card__tag\">v2.0 shipped<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"docs/components/table.md\">\n          <span class=\"docs-card__num\">component<\u002Fspan>\n          <span class=\"docs-card__title\">Table<\u002Fspan>\n          <span class=\"docs-card__desc\">Native <code class=\"dgo-inline-code\">&lt;table&gt;<\u002Fcode> + sortable headers. Coverage gaps (sticky, grid, responsive collapse) called out.<\u002Fspan>\n          <span class=\"docs-card__tag\">v2.0 shipped<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"docs/components/toast.md\">\n          <span class=\"docs-card__num\">component<\u002Fspan>\n          <span class=\"docs-card__title\">Toast<\u002Fspan>\n          <span class=\"docs-card__desc\">Region + live-region semantics. Auto-dismiss timing rules. <strong>No severity variants shipped<\u002Fstrong> — flagged as v2.1 top priority.<\u002Fspan>\n          <span class=\"docs-card__tag\">v2.0 shipped<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"docs/components/modal.md\">\n          <span class=\"docs-card__num\">component<\u002Fspan>\n          <span class=\"docs-card__title\">Modal &amp; Drawer<\u002Fspan>\n          <span class=\"docs-card__desc\">Shared dialog contract. Four-thing focus-management checklist. Native <code class=\"dgo-inline-code\">&lt;dialog&gt;<\u002Fcode> preferred for new code.<\u002Fspan>\n          <span class=\"docs-card__tag\">v2.0 shipped<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"docs/components/command-palette.md\">\n          <span class=\"docs-card__num\">component<\u002Fspan>\n          <span class=\"docs-card__title\">Command Palette<\u002Fspan>\n          <span class=\"docs-card__desc\">The §11-template worked example. Combobox + <code class=\"dgo-inline-code\">aria-activedescendant<\u002Fcode>. Tab-closes contract. Interactive demo above — try <code class=\"dgo-inline-code\">Ctrl/⌘ + K<\u002Fcode>.<\u002Fspan>\n          <span class=\"docs-card__tag\">v2.1 shipped<\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n\n      <h3>v2.1 roadmap — closed.<\u002Fh3>\n      <p style=\"margin-block-end: var(--dgo-s-4);\">All 20 v2.1-roadmap families have landed §11-template fills. Quick links by surface:<\u002Fp>\n      <div class=\"doc-panel\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--dgo-s-2) var(--dgo-s-4); font-size: var(--dgo-type-body-sm);\">\n        <div>\n          <div class=\"dgo-overline\" style=\"color: var(--dgo-color-fg-subtle); margin-block-end: var(--dgo-s-2);\">Form controls<\u002Fdiv>\n          <ul style=\"color: var(--dgo-color-fg-muted); padding-inline-start: 1.2em; margin: 0;\">\n            <li><a href=\"docs/components/select.md\">select<\u002Fa><\u002Fli>\n            <li><a href=\"docs/components/checkbox-radio.md\">checkbox / radio<\u002Fa><\u002Fli>\n            <li><a href=\"docs/components/switch.md\">switch<\u002Fa><\u002Fli>\n            <li><a href=\"docs/components/search.md\">search<\u002Fa><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div>\n          <div class=\"dgo-overline\" style=\"color: var(--dgo-color-fg-subtle); margin-block-end: var(--dgo-s-2);\">Status &amp; feedback<\u002Fdiv>\n          <ul style=\"color: var(--dgo-color-fg-muted); padding-inline-start: 1.2em; margin: 0;\">\n            <li><a href=\"docs/components/alert.md\">alert<\u002Fa><\u002Fli>\n            <li><a href=\"docs/components/badge.md\">badge / tag / chip<\u002Fa><\u002Fli>\n            <li><a href=\"docs/components/progress.md\">progress / spinner<\u002Fa><\u002Fli>\n            <li><a href=\"docs/components/skeleton.md\">skeleton<\u002Fa><\u002Fli>\n            <li><a href=\"docs/components/empty-state.md\">empty-state<\u002Fa><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div>\n          <div class=\"dgo-overline\" style=\"color: var(--dgo-color-fg-subtle); margin-block-end: var(--dgo-s-2);\">Layout chrome<\u002Fdiv>\n          <ul style=\"color: var(--dgo-color-fg-muted); padding-inline-start: 1.2em; margin: 0;\">\n            <li><a href=\"docs/components/card.md\">card<\u002Fa><\u002Fli>\n            <li><a href=\"docs/components/sidebar.md\">sidebar<\u002Fa><\u002Fli>\n            <li><a href=\"docs/components/topbar.md\">topbar<\u002Fa><\u002Fli>\n            <li><a href=\"docs/components/breadcrumb.md\">breadcrumb<\u002Fa><\u002Fli>\n            <li><a href=\"docs/components/stepper-pagination.md\">stepper / pagination<\u002Fa><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div>\n          <div class=\"dgo-overline\" style=\"color: var(--dgo-color-fg-subtle); margin-block-end: var(--dgo-s-2);\">Overlay &amp; misc<\u002Fdiv>\n          <ul style=\"color: var(--dgo-color-fg-muted); padding-inline-start: 1.2em; margin: 0;\">\n            <li><a href=\"docs/components/tooltip-popover.md\">tooltip / popover<\u002Fa><\u002Fli>\n            <li><a href=\"docs/components/menu.md\">menu / dropdown<\u002Fa><\u002Fli>\n            <li><a href=\"docs/components/avatar.md\">avatar<\u002Fa><\u002Fli>\n            <li><a href=\"docs/components/metric.md\">metric<\u002Fa><\u002Fli>\n            <li><a href=\"docs/components/kbd-code.md\">kbd / code<\u002Fa><\u002Fli>\n            <li><a href=\"docs/components/filter-bar.md\">filter-bar<\u002Fa><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 style=\"margin-block-start: var(--dgo-s-8);\">Adoption &amp; governance<\u002Fh3>\n      <p style=\"margin-block-end: var(--dgo-s-4);\">Project-root scaffolding for consumers and contributors. Bracketed <code class=\"dgo-inline-code\">[NITDA legal: …]<\u002Fcode> / <code class=\"dgo-inline-code\">[NITDA DS team: …]<\u002Fcode> markers indicate fields the agency must confirm before a public release.<\u002Fp>\n      <div class=\"docs-grid\">\n        <a class=\"docs-card\" href=\"INTEGRATION.md\">\n          <span class=\"docs-card__num\">guide<\u002Fspan>\n          <span class=\"docs-card__title\">Integration<\u002Fspan>\n          <span class=\"docs-card__desc\">Drop-in for new and existing projects. Build-tool wiring (Vite, webpack, Parcel, esbuild). Adapters for React, Vue, Svelte, Solid, Angular, Web Components. SSR, theming, tree-shaking, CDN, Storybook.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--evergreen\">v2.1<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"CONTRIBUTING.md\">\n          <span class=\"docs-card__num\">guide<\u002Fspan>\n          <span class=\"docs-card__title\">Contributing<\u002Fspan>\n          <span class=\"docs-card__desc\">PR template, commit-message convention, the RFC two-week clock, the a11y &amp; brand review surface. Setting up locally — no build step required.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--evergreen\">v2.1<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"GOVERNANCE.md\">\n          <span class=\"docs-card__num\">policy<\u002Fspan>\n          <span class=\"docs-card__title\">Governance<\u002Fspan>\n          <span class=\"docs-card__desc\">Steward, maintainers, family owners, the a11y &amp; brand veto. Four decision paths (PATCH / MINOR / MAJOR / RFC). Release gates &amp; semver clarifications. Out-of-scope statements.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--evergreen\">v2.1<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"CHANGELOG.md\">\n          <span class=\"docs-card__num\">log<\u002Fspan>\n          <span class=\"docs-card__title\">Changelog<\u002Fspan>\n          <span class=\"docs-card__desc\">Keep-a-changelog format, semver. v2.1 release notes. <strong>Added · Changed · Deprecated · Removed · Fixed · Security<\u002Fstrong> per release.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--evergreen\">v2.1<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"MIGRATION.md\">\n          <span class=\"docs-card__num\">log<\u002Fspan>\n          <span class=\"docs-card__title\">Migration<\u002Fspan>\n          <span class=\"docs-card__desc\">v2.0 → v2.1 diff (additive only). v1.0 → v2.0 cohabitation rules. Per-rename codemod recipes when breaking changes ship. Template for the next breaking version.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--evergreen\">v2.1<\u002Fspan>\n        <\u002Fa>\n        <a class=\"docs-card\" href=\"LICENSE\">\n          <span class=\"docs-card__num\">legal<\u002Fspan>\n          <span class=\"docs-card__title\">License<\u002Fspan>\n          <span class=\"docs-card__desc\">Structural stub. Bracketed <code class=\"dgo-inline-code\">[NITDA legal: …]<\u002Fcode> markers flag every field the agency must confirm. Trademark separated from code license; brand assets carved out from any code license.<\u002Fspan>\n          <span class=\"docs-card__tag docs-card__tag--proposed\">stub<\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n\n    <!-- ============= GOVERNANCE ============= -->\n    <section id=\"govern\" class=\"doc-section\">\n      <h2>Governance<\u002Fh2>\n      <p style=\"margin-block-end: var(--dgo-s-5);\">Project-root scaffolding for adoption, contribution, and release. The bracketed <code class=\"dgo-inline-code\">[NITDA legal: …]<\u002Fcode> / <code class=\"dgo-inline-code\">[NITDA DS team: …]<\u002Fcode> markers flag every field the agency must confirm before a public drop — the structure (sections, ordering, trademark separation, brand carve-out, RFC clock, deprecation cadence) is design-system work and is ready as-is.<\u002Fp>\n\n      <div class=\"dgo-grid dgo-grid--2\">\n        <div class=\"dgo-card\">\n          <h3 class=\"dgo-card__title\">Token naming<\u002Fh3>\n          <p class=\"dgo-caption\" style=\"margin-bottom: 8px;\">primitive → semantic → component<\u002Fp>\n          <pre class=\"doc-code\"><span class=\"cm\">// primitive (raw)<\u002Fspan>\n<span class=\"kw\">--dgo-green-700<\u002Fspan>: <span class=\"str\">#05583B<\u002Fspan>;\n\n<span class=\"cm\">// semantic (intent)<\u002Fspan>\n<span class=\"kw\">--dgo-color-action-primary<\u002Fspan>: <span class=\"str\">var(--dgo-green-700)<\u002Fspan>;\n\n<span class=\"cm\">// component (binding)<\u002Fspan>\n<span class=\"kw\">--dgo-btn-bg-primary<\u002Fspan>: <span class=\"str\">var(--dgo-color-action-primary)<\u002Fspan>;<\u002Fpre>\n        <\u002Fdiv>\n        <div class=\"dgo-card\">\n          <h3 class=\"dgo-card__title\">Semver &amp; deprecation<\u002Fh3>\n          <ul style=\"color: var(--dgo-color-fg-muted); font-size: var(--dgo-type-body-sm); padding-inline-start: 1.2em;\">\n            <li>MAJOR — breaking removals (1 minor warning required)<\u002Fli>\n            <li>MINOR — additive tokens, components, themes<\u002Fli>\n            <li>PATCH — visual fix, no API change<\u002Fli>\n            <li><code class=\"dgo-inline-code\">@deprecated<\u002Fcode> CSS comment + console warn on use<\u002Fli>\n            <li>RFCs for any new component family<\u002Fli>\n            <li>Six-month notice on token / class / attribute renames<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"dgo-card\">\n          <h3 class=\"dgo-card__title\">Decision paths<\u002Fh3>\n          <ol style=\"color: var(--dgo-color-fg-muted); font-size: var(--dgo-type-body-sm); padding-inline-start: 1.2em;\">\n            <li><strong>PATCH<\u002Fstrong> — direct PR, one review.<\u002Fli>\n            <li><strong>MINOR additive<\u002Fstrong> — issue → PR, two reviews + family owner.<\u002Fli>\n            <li><strong>MAJOR breaking<\u002Fstrong> — RFC required; deprecation ships in the prior minor.<\u002Fli>\n            <li><strong>RFC<\u002Fstrong> — new component family, theme, density, or template change. Two-week clock + steward sign-off.<\u002Fli>\n          <\u002Fol>\n          <p style=\"margin-block-start: var(--dgo-s-3);\"><a class=\"doc-xref\" href=\"GOVERNANCE.md\">Full policy <code>GOVERNANCE.md<\u002Fcode><\u002Fa><\u002Fp>\n        <\u002Fdiv>\n        <div class=\"dgo-card\">\n          <h3 class=\"dgo-card__title\">Release gates<\u002Fh3>\n          <ul style=\"color: var(--dgo-color-fg-muted); font-size: var(--dgo-type-body-sm); padding-inline-start: 1.2em;\">\n            <li>Changelog block renamed and dated<\u002Fli>\n            <li>README counts table reflects the release<\u002Fli>\n            <li>Showcase carries one demo per new family<\u002Fli>\n            <li>Every new family has a full §11 fill on disk<\u002Fli>\n            <li>Smoke-pass under light · dark · HC × comfortable · compact<\u002Fli>\n            <li>A11y reviewer sign-off; brand-custodian sign-off if assets touched<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin-block-start: var(--dgo-s-3);\"><a class=\"doc-xref\" href=\"CONTRIBUTING.md\">PR shape &amp; checklist <code>CONTRIBUTING.md<\u002Fcode><\u002Fa><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n\n<!-- Command Palette dialog (v2.1) — hidden by default -->\n<div class=\"dgo-cmdk-backdrop\" id=\"cmdkBackdrop\" data-state=\"closed\">\n  <div class=\"dgo-cmdk\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"cmdk-title\" id=\"cmdkDialog\">\n    <h2 id=\"cmdk-title\" class=\"dgo-visually-hidden\">Command Palette<\u002Fh2>\n\n    <div class=\"dgo-cmdk__search\">\n      <svg class=\"dgo-cmdk__search-icon\" aria-hidden=\"true\"><use href=\"b3aa3f04-1df3-4e47-be12-707d6d29c77c#i-search\"><\u002Fuse><\u002Fsvg>\n      <input class=\"dgo-cmdk__input\" id=\"cmdkInput\" type=\"text\" role=\"combobox\" aria-expanded=\"true\" aria-controls=\"cmdkListbox\" aria-activedescendant=\"\" aria-autocomplete=\"list\" aria-label=\"Search commands, dossiers, and operators\" placeholder=\"Search commands, dossiers, operators…\" autocomplete=\"off\" spellcheck=\"false\">\n      <span class=\"dgo-cmdk__hint\" aria-hidden=\"true\">↑↓ ↵ Esc<\u002Fspan>\n    <\u002Fdiv>\n\n    <ul class=\"dgo-cmdk__listbox\" id=\"cmdkListbox\" role=\"listbox\" aria-label=\"Results\"><\u002Ful>\n\n    <div class=\"dgo-cmdk__footer\">\n      <span class=\"dgo-cmdk__footer-hint\">\n        <kbd class=\"dgo-kbd\">↑↓<\u002Fkbd> navigate ·\n        <kbd class=\"dgo-kbd\">↵<\u002Fkbd> select ·\n        <kbd class=\"dgo-kbd\">Esc<\u002Fkbd> dismiss ·\n        <kbd class=\"dgo-kbd\">Tab<\u002Fkbd> close\n      <\u002Fspan>\n      <span class=\"dgo-cmdk__footer-brand\">DGO · cmdk<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- a11y live region for result-count announcements -->\n<span class=\"dgo-visually-hidden\" role=\"status\" aria-live=\"polite\" id=\"cmdkStatus\"><\u002Fspan>\n\n<script>\n  /* ============================================================\n     Command Palette behaviour — illustrative, system-shipped CSS only.\n     Implements docs/components/command-palette.md §8 (JS contract).\n     ============================================================ */\n  (function () {\n    const COMMANDS = [\n      { group: 'Navigation', icon: 'i-home',     label: 'Dashboard',                 meta: ['G','D'] },\n      { group: 'Navigation', icon: 'i-folder',   label: 'Dossiers',                  meta: ['G','O'] },\n      { group: 'Navigation', icon: 'i-users',    label: 'Operators directory',       meta: ['G','U'] },\n      { group: 'Navigation', icon: 'i-chart',    label: 'Reports & analytics',       meta: ['G','R'] },\n      { group: 'Navigation', icon: 'i-settings', label: 'Settings',                  meta: ['G','S'] },\n\n      { group: 'Actions',    icon: 'i-plus',     label: 'New dossier',                meta: ['Ctrl','N'] },\n      { group: 'Actions',    icon: 'i-mail',     label: 'Compose routed message',     meta: ['Ctrl','M'] },\n      { group: 'Actions',    icon: 'i-check',    label: 'Approve selected task',      meta: ['Ctrl','↵'] },\n      { group: 'Actions',    icon: 'i-download', label: 'Export CSV (filtered view)', meta: ['Ctrl','⇧','E'] },\n      { group: 'Actions',    icon: 'i-archive',  label: 'Restore from archive',       meta: null, disabled: true, badge: 'Compliance only' },\n\n      { group: 'Recent dossiers', icon: 'i-file', label: 'DGO/2026/0421 — Domain transfer · nimc.gov.ng', meta: 'opened 2m' },\n      { group: 'Recent dossiers', icon: 'i-file', label: 'DGO/2026/0418 — IT clearance · NPC HQ',         meta: 'opened 14m' },\n      { group: 'Recent dossiers', icon: 'i-file', label: 'DGO/2026/0411 — OEM cert · Zinox Tech',         meta: 'opened 1h' },\n      { group: 'Recent dossiers', icon: 'i-file', label: 'DGO/2026/0397 — License audit · Galaxy Backbone', meta: 'opened yesterday' },\n\n      { group: 'Help',       icon: 'i-info',     label: 'Keyboard shortcuts',         meta: '?' },\n      { group: 'Help',       icon: 'i-globe',    label: 'Switch language (Yorùbá · Hausa · Igbo)', meta: null },\n    ];\n\n    const $backdrop = document.getElementById('cmdkBackdrop');\n    const $dialog   = document.getElementById('cmdkDialog');\n    const $input    = document.getElementById('cmdkInput');\n    const $listbox  = document.getElementById('cmdkListbox');\n    const $status   = document.getElementById('cmdkStatus');\n    const $main     = document.getElementById('content') || document.querySelector('main');\n\n    let activeIndex = 0;\n    let visible = [];\n    let lastTrigger = null;\n\n    function escapeHTML(s) {\n      return s.replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\n    }\n\n    function highlight(label, q) {\n      if (!q) return escapeHTML(label);\n      const i = label.toLowerCase().indexOf(q.toLowerCase());\n      if (i < 0) return escapeHTML(label);\n      return escapeHTML(label.slice(0, i))\n        + '<mark>' + escapeHTML(label.slice(i, i + q.length)) + '<\u002Fmark>'\n        + escapeHTML(label.slice(i + q.length));\n    }\n\n    function metaHTML(m) {\n      if (m == null) return '';\n      if (Array.isArray(m)) return m.map(k => `<kbd class=\"dgo-kbd\">${escapeHTML(k)}<\u002Fkbd>`).join('');\n      return `<span>${escapeHTML(m)}<\u002Fspan>`;\n    }\n\n    function render(q) {\n      q = (q || '').trim();\n      const filtered = q\n        ? COMMANDS.filter(c => c.label.toLowerCase().includes(q.toLowerCase()))\n        : COMMANDS.slice();\n\n      visible = filtered;\n      $listbox.innerHTML = '';\n\n      if (filtered.length === 0) {\n        const li = document.createElement('li');\n        li.className = 'dgo-cmdk__empty';\n        li.setAttribute('role', 'status');\n        li.innerHTML = `<strong>No matches<\u002Fstrong>Try a different keyword, or press <kbd class=\"dgo-kbd\">Esc<\u002Fkbd> to dismiss.`;\n        $listbox.appendChild(li);\n        $listbox.setAttribute('data-empty', 'true');\n        $input.setAttribute('aria-activedescendant', '');\n        $status.textContent = 'No results';\n        return;\n      }\n\n      $listbox.setAttribute('data-empty', 'false');\n\n      // Group consecutively\n      let lastGroup = null;\n      let groupUL = null;\n      filtered.forEach((cmd, i) => {\n        if (cmd.group !== lastGroup) {\n          const groupLi = document.createElement('li');\n          groupLi.className = 'dgo-cmdk__group';\n          groupLi.setAttribute('role', 'group');\n          const gid = 'cmdk-g-' + i;\n          groupLi.setAttribute('aria-labelledby', gid);\n          const label = document.createElement('div');\n          label.className = 'dgo-cmdk__group-label';\n          label.id = gid;\n          label.textContent = cmd.group;\n          groupUL = document.createElement('ul');\n          groupLi.appendChild(label);\n          groupLi.appendChild(groupUL);\n          $listbox.appendChild(groupLi);\n          lastGroup = cmd.group;\n        }\n\n        const item = document.createElement('li');\n        item.className = 'dgo-cmdk__item';\n        item.id = 'cmdk-i-' + i;\n        item.setAttribute('role', 'option');\n        item.setAttribute('aria-selected', i === activeIndex ? 'true' : 'false');\n        if (cmd.disabled) item.setAttribute('aria-disabled', 'true');\n        item.dataset.index = String(i);\n\n        item.innerHTML = `\n          <svg class=\"dgo-cmdk__item-icon\" aria-hidden=\"true\"><use href=\"assets/icons/sprite.svg#${cmd.icon}\"/><\u002Fsvg>\n          <span class=\"dgo-cmdk__item-label\">${highlight(cmd.label, q)}<\u002Fspan>\n          <span class=\"dgo-cmdk__item-meta\">${cmd.badge ? `<span class=\"dgo-badge dgo-badge--neutral\">${escapeHTML(cmd.badge)}<\u002Fspan>` : metaHTML(cmd.meta)}<\u002Fspan>`;\n\n        item.addEventListener('mousemove', () => {\n          if (cmd.disabled) return;\n          setActive(i, false);\n        });\n        item.addEventListener('click', () => {\n          if (cmd.disabled) return;\n          invoke(i);\n        });\n\n        groupUL.appendChild(item);\n      });\n\n      // Ensure activeIndex points to a non-disabled, visible item\n      if (activeIndex >= filtered.length) activeIndex = 0;\n      while (activeIndex < filtered.length && filtered[activeIndex].disabled) activeIndex++;\n      if (activeIndex >= filtered.length) activeIndex = 0;\n\n      syncActive();\n      $status.textContent = `${filtered.length} result${filtered.length === 1 ? '' : 's'}`;\n    }\n\n    function syncActive() {\n      const items = $listbox.querySelectorAll('.dgo-cmdk__item');\n      items.forEach(it => {\n        const i = Number(it.dataset.index);\n        it.setAttribute('aria-selected', i === activeIndex ? 'true' : 'false');\n      });\n      const id = `cmdk-i-${activeIndex}`;\n      $input.setAttribute('aria-activedescendant', id);\n      const el = document.getElementById(id);\n      if (el) el.scrollIntoView({ block: 'nearest' });\n    }\n\n    function setActive(i, scroll) {\n      if (visible[i] && visible[i].disabled) return;\n      activeIndex = i;\n      syncActive();\n    }\n\n    function step(dir) {\n      if (!visible.length) return;\n      let i = activeIndex;\n      for (let n = 0; n < visible.length; n++) {\n        i = (i + dir + visible.length) % visible.length;\n        if (!visible[i].disabled) { activeIndex = i; syncActive(); return; }\n      }\n    }\n\n    function invoke(i) {\n      const cmd = visible[i];\n      if (!cmd || cmd.disabled) return;\n      $status.textContent = `Invoked: ${cmd.label}`;\n      close('selection');\n    }\n\n    function open(source) {\n      lastTrigger = document.activeElement;\n      $backdrop.dataset.state = 'open';\n      if ($main) $main.setAttribute('inert', '');\n      $input.value = '';\n      activeIndex = 0;\n      render('');\n      // Defer focus so the dialog has mounted\n      requestAnimationFrame(() => $input.focus());\n    }\n\n    function close(reason) {\n      $backdrop.dataset.state = 'closing';\n      if ($main) $main.removeAttribute('inert');\n      // Match the exit duration in CSS (--dgo-motion-exit ≈ var(--dgo-dur-fast))\n      setTimeout(() => {\n        $backdrop.dataset.state = 'closed';\n        if (lastTrigger && typeof lastTrigger.focus === 'function') {\n          try { lastTrigger.focus(); } catch (e) {}\n        }\n      }, 180);\n    }\n\n    function isOpen() { return $backdrop.dataset.state === 'open'; }\n\n    /* Global opener — Ctrl/⌘ + K, capture phase so an input doesn't swallow it */\n    document.addEventListener('keydown', function (e) {\n      const isMod = e.ctrlKey || e.metaKey;\n      if (isMod && (e.key === 'k' || e.key === 'K')) {\n        e.preventDefault();\n        if (isOpen()) {\n          $input.select();\n        } else {\n          open('keyboard');\n        }\n      }\n    }, true);\n\n    /* In-palette keyboard */\n    $input.addEventListener('keydown', function (e) {\n      if (e.key === 'ArrowDown') { e.preventDefault(); step(+1); }\n      else if (e.key === 'ArrowUp')   { e.preventDefault(); step(-1); }\n      else if (e.key === 'Home')      { e.preventDefault(); activeIndex = 0; syncActive(); }\n      else if (e.key === 'End')       { e.preventDefault(); activeIndex = visible.length - 1; syncActive(); }\n      else if (e.key === 'Enter')     { e.preventDefault(); invoke(activeIndex); }\n      else if (e.key === 'Tab')       { e.preventDefault(); close('tab'); }\n      else if (e.key === 'Escape')    {\n        e.preventDefault();\n        if ($input.value) { $input.value = ''; render(''); }\n        else { close('escape'); }\n      }\n    });\n\n    /* Filter on input */\n    $input.addEventListener('input', function () {\n      activeIndex = 0;\n      render($input.value);\n    });\n\n    /* Click outside to close */\n    $backdrop.addEventListener('mousedown', function (e) {\n      if (e.target === $backdrop) close('outside-click');\n    });\n\n    /* Wire the demo button */\n    const $openBtn = document.getElementById('cmdkOpen');\n    if ($openBtn) $openBtn.addEventListener('click', function () { open('button'); });\n  })();\n<\u002Fscript>\n\n\n\n<div class=\"theme-toggle\" role=\"group\" aria-label=\"Theme\">\n  <button data-theme-set=\"light\" aria-pressed=\"true\">Light<\u002Fbutton>\n  <button data-theme-set=\"dark\" aria-pressed=\"false\">Dark<\u002Fbutton>\n  <button data-theme-set=\"hc\" aria-pressed=\"false\">HC<\u002Fbutton>\n  <span style=\"width:1px; background: var(--dgo-color-border-default); margin: 4px;\"><\u002Fspan>\n  <button data-density-set=\"comfortable\" aria-pressed=\"true\">Comfortable<\u002Fbutton>\n  <button data-density-set=\"compact\" aria-pressed=\"false\">Compact<\u002Fbutton>\n<\u002Fdiv>\n\n<script>\n  const html = document.documentElement;\n  document.querySelectorAll('[data-theme-set]').forEach(btn => {\n    btn.addEventListener('click', () => {\n      html.setAttribute('data-theme', btn.dataset.themeSet);\n      document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b === btn));\n    });\n  });\n  document.querySelectorAll('[data-density-set]').forEach(btn => {\n    btn.addEventListener('click', () => {\n      html.setAttribute('data-density', btn.dataset.densitySet);\n      document.querySelectorAll('[data-density-set]').forEach(b => b.setAttribute('aria-pressed', b === btn));\n    });\n  });\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
