  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

go-color-fg-disabled:       var(--dgo-ink-300);\n  --dgo-color-fg-on-brand:       var(--dgo-ink-0);\n  --dgo-color-fg-on-accent:      var(--dgo-ink-0);\n  --dgo-color-fg-link:           var(--dgo-green-700);\n  --dgo-color-fg-link-hover:     var(--dgo-smart-500);\n  --dgo-color-fg-link-visited:   var(--dgo-green-800);\n\n  /* ---------- Border ---------- */\n  --dgo-color-border-default:    var(--dgo-ink-100);\n  --dgo-color-border-strong:     var(--dgo-ink-200);\n  --dgo-color-border-stronger:   var(--dgo-ink-300);\n  --dgo-color-border-brand:      var(--dgo-green-700);\n  --dgo-color-border-accent:     var(--dgo-smart-400);\n  --dgo-color-border-on-brand:   rgba(255, 255, 255, 0.20);\n  --dgo-color-border-focus:      var(--dgo-smart-400);\n\n  /* ---------- Status (subtle + strong pairs) ---------- */\n  --dgo-color-info-subtle-bg:    var(--dgo-info-50);\n  --dgo-color-info-subtle-fg:    var(--dgo-info-800);\n  --dgo-color-info-strong-bg:    var(--dgo-info-600);\n  --dgo-color-info-strong-fg:    var(--dgo-ink-0);\n\n  --dgo-color-success-subtle-bg: var(--dgo-smart-50);\n  --dgo-color-success-subtle-fg: var(--dgo-smart-600);\n  --dgo-color-success-strong-bg: var(--dgo-smart-500);\n  --dgo-color-success-strong-fg: var(--dgo-ink-0);\n\n  --dgo-color-warning-subtle-bg: var(--dgo-warn-50);\n  --dgo-color-warning-subtle-fg: var(--dgo-warn-800);\n  --dgo-color-warning-strong-bg: var(--dgo-warn-400);\n  --dgo-color-warning-strong-fg: var(--dgo-ink-900);\n\n  --dgo-color-danger-subtle-bg:  var(--dgo-danger-50);\n  --dgo-color-danger-subtle-fg:  var(--dgo-danger-800);\n  --dgo-color-danger-strong-bg:  var(--dgo-danger-600);\n  --dgo-color-danger-strong-fg:  var(--dgo-ink-0);\n\n  /* ---------- Operational status (DGO workflow) ---------- */\n  --dgo-color-status-pending-bg:    var(--dgo-warn-50);\n  --dgo-color-status-pending-fg:    var(--dgo-warn-800);\n  --dgo-color-status-routed-bg:     var(--dgo-info-50);\n  --dgo-color-status-routed-fg:     var(--dgo-info-800);\n  --dgo-color-status-replied-bg:    var(--dgo-smart-50);\n  --dgo-color-status-replied-fg:    var(--dgo-smart-600);\n  --dgo-color-status-action-bg:     var(--dgo-danger-50);\n  --dgo-color-status-action-fg:     var(--dgo-danger-800);\n  --dgo-color-status-draft-bg:      var(--dgo-green-50);\n  --dgo-color-status-draft-fg:      var(--dgo-green-800);\n  --dgo-color-status-archived-bg:   var(--dgo-ink-50);\n  --dgo-color-status-archived-fg:   var(--dgo-ink-600);\n  --dgo-color-status-escalated-bg:  #FAD2D9;\n  --dgo-color-status-escalated-fg:  #780820;\n\n  /* ---------- Focus ring ---------- */\n  --dgo-focus-ring:    0 0 0 2px var(--dgo-color-surface-page), 0 0 0 5px var(--dgo-smart-400);\n  --dgo-focus-ring-inset: inset 0 0 0 3px var(--dgo-smart-400);\n\n  /* ---------- Type intent ---------- */\n  --dgo-type-display-xxl: var(--dgo-size-60);\n  --dgo-type-display-xl:  var(--dgo-size-48);\n  --dgo-type-display:     var(--dgo-size-40);\n  --dgo-type-h1:          var(--dgo-size-33);\n  --dgo-type-h2:          var(--dgo-size-28);\n  --dgo-type-h3:          var(--dgo-size-23);\n  --dgo-type-h4:          var(--dgo-size-19);\n  --dgo-type-body-lg:     var(--dgo-size-16);\n  --dgo-type-body:        var(--dgo-size-14);\n  --dgo-type-body-sm:     var(--dgo-size-12);\n  --dgo-type-caption:     var(--dgo-size-12);\n\n  /* ---------- Radius intent ---------- */\n  --dgo-radius-sharp:    var(--dgo-r-2);\n  --dgo-radius-control:  var(--dgo-r-6);\n  --dgo-radius-card:     var(--dgo-r-10);\n  --dgo-radius-frame:    var(--dgo-r-18);\n  --dgo-radius-circle:   var(--dgo-r-pill);\n\n  /* ---------- Elevation intent ---------- */\n  --dgo-elevation-flat:    var(--dgo-shadow-0);\n  --dgo-elevation-card:    var(--dgo-shadow-2);\n  --dgo-elevation-raised:  var(--dgo-shadow-3);\n  --dgo-elevation-overlay: var(--dgo-shadow-4);\n  --dgo-elevation-modal:   var(--dgo-shadow-5);\n  --dgo-elevation-popover: var(--dgo-shadow-4);\n\n  /* ---------- Motion intent ---------- */\n  --dgo-motion-enter:  var(--dgo-dur-slow) var(--dgo-ease-entrance);\n  --dgo-motion-exit:   var(--dgo-dur-fast) var(--dgo-ease-exit);\n  --dgo-motion-state:  var(--dgo-dur-base) var(--dgo-ease-standard);\n  --dgo-motion-hero:   var(--dgo-dur-deliberate) var(--dgo-ease-emphasized);\n}\n\n/* ============= Reduced motion ============= */\n@media (prefers-reduced-motion: reduce) {\n  :root {\n    --dgo-dur-instant:    0ms;\n    --dgo-dur-fast:       0ms;\n    --dgo-dur-base:       0ms;\n    --dgo-dur-slow:       50ms;\n    --dgo-dur-deliberate: 50ms;\n  }\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   DGO v2.0 — Theme: Light (default)\n   Activated by [data-theme=\"light\"] or absence of attribute.\n   ============================================================ */\n\n[data-theme=\"light\"], :root {\n  --dgo-paper:                #FFFFFF;\n  --dgo-paper-raised:         #FFFFFF;\n  --dgo-paper-sunken:         #F5F4F4;\n\n  --dgo-color-surface-page:   #FFFFFF;\n  --dgo-color-surface-raised: #FFFFFF;\n  --dgo-color-surface-sunken: #F5F4F4;\n  --dgo-color-surface-muted:  #FAFAF9;\n  --dgo-color-surface-inverse:#022819;\n\n  --dgo-color-fg-default:     var(--dgo-ink-900);\n  --dgo-color-fg-muted:       var(--dgo-ink-500);\n  --dgo-color-border-default: var(--dgo-ink-100);\n\n  color-scheme: light;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   DGO v2.0 — Theme: Dark\n   Activated by [data-theme=\"dark\"].\n   Re-binds semantic tokens; primitives untouched.\n   ============================================================ */\n\n[data-theme=\"dark\"] {\n  /* Surfaces */\n  --dgo-paper:                #0B1410;\n  --dgo-paper-raised:         #122019;\n  --dgo-paper-sunken:         #081109;\n  --dgo-overlay-tint:         rgba(0, 0, 0, 0.72);\n\n  --dgo-color-surface-page:   #0B1410;\n  --dgo-color-surface-raised: #122019;\n  --dgo-color-surface-sunken: #081109;\n  --dgo-color-surface-muted:  #162720;\n  --dgo-color-surface-inverse:#FFFFFF;\n  --dgo-color-surface-brand:  var(--dgo-green-700);\n\n  /* Text */\n  --dgo-color-fg-default:     #E8EDEA;\n  --dgo-color-fg-strong:      #FFFFFF;\n  --dgo-color-fg-muted:       #9AA8A2;\n  --dgo-color-fg-subtle:      #6F7E78;\n  --dgo-color-fg-disabled:    #4F5C57;\n  --dgo-color-fg-on-brand:    #FFFFFF;\n  --dgo-color-fg-link:        var(--dgo-smart-300);\n  --dgo-color-fg-link-hover:  var(--dgo-smart-200);\n\n  /* Borders */\n  --dgo-color-border-default: #1F2F27;\n  --dgo-color-border-strong:  #2D3F36;\n  --dgo-color-border-stronger:#42554B;\n\n  /* Status — keep subtle bg low-saturation, fg high-contrast */\n  --dgo-color-info-subtle-bg:    rgba(42,138,209,0.18);\n  --dgo-color-info-subtle-fg:    #82BFE8;\n  --dgo-color-success-subtle-bg: rgba(23,178,85,0.18);\n  --dgo-color-success-subtle-fg: #6FE0A0;\n  --dgo-color-warning-subtle-bg: rgba(225,161,0,0.18);\n  --dgo-color-warning-subtle-fg: #F6CE5C;\n  --dgo-color-danger-subtle-bg:  rgba(200,16,46,0.20);\n  --dgo-color-danger-subtle-fg:  #F1909F;\n\n  /* Operational status — dark */\n  --dgo-color-status-pending-bg:   rgba(225,161,0,0.18);\n  --dgo-color-status-pending-fg:   #F6CE5C;\n  --dgo-color-status-routed-bg:    rgba(42,138,209,0.18);\n  --dgo-color-status-routed-fg:    #82BFE8;\n  --dgo-color-status-replied-bg:   rgba(23,178,85,0.18);\n  --dgo-color-status-replied-fg:   #6FE0A0;\n  --dgo-color-status-action-bg:    rgba(200,16,46,0.20);\n  --dgo-color-status-action-fg:    #F1909F;\n  --dgo-color-status-draft-bg:     rgba(5,88,59,0.30);\n  --dgo-color-status-draft-fg:     #9CD1B5;\n  --dgo-color-status-archived-bg:  #1A2925;\n  --dgo-color-status-archived-fg:  #9AA8A2;\n  --dgo-color-status-escalated-bg: rgba(120,8,32,0.45);\n  --dgo-color-status-escalated-fg: #F4B5BF;\n\n  /* Component re-binds */\n  --dgo-card-bg:           #122019;\n  --dgo-card-border:       #1F2F27;\n  --dgo-input-bg:          #0E1A14;\n  --dgo-input-bg-disabled: #162720;\n  --dgo-input-border:      #2D3F36;\n  --dgo-table-header-bg:   #0E1A14;\n  --dgo-table-row-hover:   #162720;\n\n  /* Shadows lighter in dark */\n  --dgo-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.40);\n  --dgo-shadow-2: 0 1px 3px rgba(0, 0, 0, 0.50), 0 1px 2px rgba(0, 0, 0, 0.30);\n  --dgo-shadow-3: 0 4px 6px rgba(0, 0, 0, 0.50), 0 2px 4px rgba(0, 0, 0, 0.30);\n  --dgo-shadow-4: 0 10px 15px rgba(0, 0, 0, 0.55);\n  --dgo-shadow-5: 0 20px 28px rgba(0, 0, 0, 0.60);\n\n  --dgo-focus-ring: 0 0 0 2px #0B1410, 0 0 0 5px var(--dgo-smart-300);\n\n  color-scheme: dark;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   DGO v2.0 — Theme: High-Contrast\n   Activated by [data-theme=\"hc\"].\n   Targets WCAG 2.2 AAA where possible.\n   ============================================================ */\n\n[data-theme=\"hc\"] {\n  --dgo-paper:                #FFFFFF;\n  --dgo-paper-raised:         #FFFFFF;\n  --dgo-paper-sunken:         #F5F4F4;\n\n  --dgo-color-surface-page:   #FFFFFF;\n  --dgo-color-surface-raised: #FFFFFF;\n  --dgo-color-surface-sunken: #F0EFEF;\n  --dgo-color-surface-muted:  #FFFFFF;\n  --dgo-color-surface-inverse:#000000;\n\n  /* Text — pushed to black/white */\n  --dgo-color-fg-default:     #000000;\n  --dgo-color-fg-strong:      #000000;\n  --dgo-color-fg-muted:       #2D2C2C;\n  --dgo-color-fg-subtle:      #4A4849;\n  --dgo-color-fg-on-brand:    #FFFFFF;\n  --dgo-color-fg-link:        #022819;\n  --dgo-color-fg-link-hover:  #000000;\n\n  /* Borders — high contrast */\n  --dgo-color-border-default: #000000;\n  --dgo-color-border-strong:  #000000;\n  --dgo-color-border-stronger:#000000;\n\n  /* Action — deepest greens */\n  --dgo-color-action-primary:        #022819;\n  --dgo-color-action-primary-hover:  #000000;\n  --dgo-color-action-primary-press:  #000000;\n  --dgo-color-action-accent:         #0A5828;\n  --dgo-color-action-danger:         #780820;\n\n  /* Status — bold colors, dark text */\n  --dgo-color-status-pending-bg:    #FBF1D8;\n  --dgo-color-status-pending-fg:    #5A3F00;\n  --dgo-color-status-routed-bg:     #E6F0F8;\n  --dgo-color-status-routed-fg:     #054871;\n  --dgo-color-status-replied-bg:    #C2EED2;\n  --dgo-color-status-replied-fg:    #07401D;\n  --dgo-color-status-action-bg:     #FBE7EB;\n  --dgo-color-status-action-fg:     #780820;\n  --dgo-color-status-draft-bg:      #CFE3D8;\n  --dgo-color-status-draft-fg:      #022819;\n  --dgo-color-status-archived-bg:   #E8E6E7;\n  --dgo-color-status-archived-fg:   #000000;\n  --dgo-color-status-escalated-bg:  #780820;\n  --dgo-color-status-escalated-fg:  #FFFFFF;\n\n  /* Components */\n  --dgo-card-border:       #000000;\n  --dgo-input-border:      #000000;\n  --dgo-input-border-hover:#000000;\n  --dgo-table-border:      #000000;\n\n  /* Focus — thicker, black-and-yellow stack */\n  --dgo-focus-ring: 0 0 0 2px #FFFFFF, 0 0 0 6px #000000, 0 0 0 9px #E1A100;\n\n  color-scheme: light;\n}\n\n/* When the OS asks for forced colors, lean on system colors */\n@media (forced-colors: active) {\n  :root {\n    --dgo-color-action-primary: ButtonText;\n    --dgo-color-border-default: CanvasText;\n    --dgo-color-fg-default: CanvasText;\n    --dgo-color-fg-link: LinkText;\n  }\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   DGO Design System v2.0 — Component Tokens\n   Per-component bindings. Themes/density override here.\n   ============================================================ */\n\n:root {\n  /* ---------- Button ---------- */\n  --dgo-btn-radius:           var(--dgo-radius-control);\n  --dgo-btn-fw:               var(--dgo-wt-600);\n  --dgo-btn-tracking:         var(--dgo-tr-normal);\n  --dgo-btn-h-sm:             32px;\n  --dgo-btn-h-md:             40px;\n  --dgo-btn-h-lg:             48px;\n  --dgo-btn-px-sm:            var(--dgo-s-3);\n  --dgo-btn-px-md:            var(--dgo-s-4);\n  --dgo-btn-px-lg:            var(--dgo-s-5);\n\n  /* ---------- Input ---------- */\n  --dgo-input-radius:         var(--dgo-radius-control);\n  --dgo-input-h:              40px;\n  --dgo-input-px:             var(--dgo-s-3);\n  --dgo-input-bg:             var(--dgo-color-surface-page);\n  --dgo-input-bg-disabled:    var(--dgo-color-surface-muted);\n  --dgo-input-border:         var(--dgo-color-border-strong);\n  --dgo-input-border-hover:   var(--dgo-color-border-stronger);\n  --dgo-input-border-focus:   var(--dgo-color-action-primary);\n  --dgo-input-border-error:   var(--dgo-color-danger-strong-bg);\n  --dgo-input-placeholder:    var(--dgo-color-fg-subtle);\n\n  /* ---------- Card ---------- */\n  --dgo-card-bg:              var(--dgo-color-surface-raised);\n  --dgo-card-border:          var(--dgo-color-border-default);\n  --dgo-card-radius:          var(--dgo-radius-card);\n  --dgo-card-pad:             var(--dgo-s-5);\n  --dgo-card-shadow:          var(--dgo-elevation-card);\n  --dgo-card-shadow-hover:    var(--dgo-elevation-raised);\n\n  /* ---------- Badge / pill ---------- */\n  --dgo-badge-radius:         var(--dgo-r-pill);\n  --dgo-badge-h:              22px;\n  --dgo-badge-px:             var(--dgo-s-2);\n  --dgo-badge-fs:             var(--dgo-size-12);\n  --dgo-badge-fw:             var(--dgo-wt-600);\n  --dgo-badge-tracking:       var(--dgo-tr-normal);\n\n  /* ---------- Tag (square) ---------- */\n  --dgo-tag-radius:           var(--dgo-r-4);\n  --dgo-tag-h:                24px;\n\n  /* ---------- Alert / Banner ---------- */\n  --dgo-alert-radius:         var(--dgo-radius-control);\n  --dgo-alert-pad:            var(--dgo-s-4);\n  --dgo-alert-border-w:       1px;\n\n  /* ---------- Modal / Drawer ---------- */\n  --dgo-modal-radius:         var(--dgo-radius-frame);\n  --dgo-modal-pad:            var(--dgo-s-6);\n  --dgo-modal-w:              560px;\n  --dgo-modal-w-lg:           800px;\n  --dgo-modal-shadow:         var(--dgo-elevation-modal);\n  --dgo-drawer-w:             400px;\n\n  /* ---------- Popover / Tooltip ---------- */\n  --dgo-popover-radius:       var(--dgo-radius-card);\n  --dgo-popover-pad:          var(--dgo-s-3);\n  --dgo-popover-shadow:       var(--dgo-elevation-popover);\n  --dgo-tooltip-bg:           var(--dgo-ink-900);\n  --dgo-tooltip-fg:           var(--dgo-ink-0);\n  --dgo-tooltip-radius:       var(--dgo-r-6);\n\n  /* ---------- Table ---------- */\n  --dgo-table-row-h:          44px;\n  --dgo-table-cell-px:        var(--dgo-s-3);\n  --dgo-table-header-bg:      var(--dgo-color-surface-sunken);\n  --dgo-table-header-fg:      var(--dgo-color-fg-muted);\n  --dgo-table-row-hover:      var(--dgo-green-50);\n  --dgo-table-border:         var(--dgo-color-border-default);\n\n  /* ---------- Sidebar / Topbar ---------- */\n  --dgo-sidebar-w:            260px;\n  --dgo-sidebar-w-collapsed:  68px;\n  --dgo-sidebar-bg:           var(--dgo-color-surface-inverse);\n  --dgo-sidebar-fg:           rgba(255,255,255,0.82);\n  --dgo-topbar-h:             64px;\n  --dgo-topbar-bg:            var(--dgo-color-surface-page);\n  --dgo-topbar-border:        var(--dgo-color-border-default);\n\n  /* ---------- Tabs ---------- */\n  --dgo-tabs-indicator-h:     2px;\n  --dgo-tabs-indicator:       var(--dgo-color-action-accent);\n\n  /* ---------- Pagination ---------- */\n  --dgo-pagination-h:         36px;\n  --dgo-pagination-radius:    var(--dgo-radius-control);\n\n  /* ---------- Progress ---------- */\n  --dgo-progress-h:           6px;\n  --dgo-progress-track:       var(--dgo-color-surface-sunken);\n  --dgo-progress-fill:        var(--dgo-color-action-primary);\n\n  /* ---------- Skeleton ---------- */\n  --dgo-skeleton-base:        var(--dgo-ink-50);\n  --dgo-skeleton-shine:       var(--dgo-ink-100);\n\n  /* ---------- Code ---------- */\n  --dgo-code-bg:              var(--dgo-color-surface-sunken);\n  --dgo-code-fg:              var(--dgo-green-900);\n  --dgo-kbd-bg:               var(--dgo-color-surface-page);\n  --dgo-kbd-border:           var(--dgo-color-border-strong);\n\n  /* ---------- Command Palette (v2.1) ---------- */\n  --dgo-cmdk-w:               clamp(320px, 90vw, 640px);\n  --dgo-cmdk-bg:              var(--dgo-color-surface-raised);\n  --dgo-cmdk-border:          var(--dgo-color-border-default);\n  --dgo-cmdk-radius:          var(--dgo-radius-frame);\n  --dgo-cmdk-shadow:          var(--dgo-elevation-modal);\n  --dgo-cmdk-pad:             var(--dgo-s-2);\n  --dgo-cmdk-input-h:         48px;\n  --dgo-cmdk-input-fs:        var(--dgo-type-body-lg);\n  --dgo-cmdk-input-bg:        transparent;\n  --dgo-cmdk-item-h:          44px;\n  --dgo-cmdk-item-pad:        var(--dgo-s-3);\n  --dgo-cmdk-item-radius:     var(--dgo-radius-control);\n  --dgo-cmdk-item-fs:         var(--dgo-type-body);\n  --dgo-cmdk-item-bg:         transparent;\n  --dgo-cmdk-item-bg-active:  var(--dgo-green-50);\n  --dgo-cmdk-item-fg-active:  var(--dgo-color-fg-strong);\n  --dgo-cmdk-meta-fg:         var(--dgo-color-fg-muted);\n  --dgo-cmdk-group-label-fg:  var(--dgo-color-fg-muted);\n  --dgo-cmdk-backdrop-bg:     var(--dgo-color-surface-overlay);\n  --dgo-cmdk-z:               var(--dgo-z-modal);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   DGO v2.0 — Density modes\n   [data-density=\"comfortable\"] (default) | [data-density=\"compact\"]\n   ============================================================ */\n\n:root,\n[data-density=\"comfortable\"] {\n  --dgo-density-pad:          var(--dgo-s-4);\n  --dgo-density-pad-y:        var(--dgo-s-3);\n  --dgo-density-gap:          var(--dgo-s-3);\n  --dgo-density-row:          48px;\n\n  --dgo-btn-h-sm:             32px;\n  --dgo-btn-h-md:             40px;\n  --dgo-btn-h-lg:             48px;\n  --dgo-input-h:              40px;\n  --dgo-table-row-h:          48px;\n  --dgo-card-pad:             var(--dgo-s-5);\n}\n\n[data-density=\"compact\"] {\n  --dgo-density-pad:          var(--dgo-s-2);\n  --dgo-density-pad-y:        var(--dgo-s-1_5);\n  --dgo-density-gap:          var(--dgo-s-2);\n  --dgo-density-row:          36px;\n\n  --dgo-btn-h-sm:             28px;\n  --dgo-btn-h-md:             32px;\n  --dgo-btn-h-lg:             40px;\n  --dgo-input-h:              32px;\n  --dgo-table-row-h:          36px;\n  --dgo-card-pad:             var(--dgo-s-4);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   DGO v2.0 — Modern Reset\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml {\n  -webkit-text-size-adjust: 100%;\n  -moz-text-size-adjust: 100%;\n  text-size-adjust: 100%;\n  text-rendering: optimizeLegibility;\n}\n\nbody {\n  margin: 0;\n  min-height: 100vh;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nh1, h2, h3, h4, h5, h6, p, figure, blockquote, dl, dd { margin: 0; }\nul[role=\"list\"], ol[role=\"list\"] { list-style: none; padding: 0; margin: 0; }\n\na { color: inherit; }\nimg, picture, video, canvas, svg { display: block; max-width: 100%; }\ninput, button, textarea, select { font: inherit; color: inherit; }\n\nbutton {\n  background: none;\n  border: 0;\n  padding: 0;\n  cursor: pointer;\n}\n\ntable { border-collapse: collapse; }\n[hidden] { display: none !important; }\n\n/* Focus outline replaced everywhere with semantic focus ring */\n:focus { outline: none; }\n:focus-visible { outline: none; }\n\n/* Logical-only margin reset for RTL safety */\nul, ol {\n  padding-inline-start: 1.5rem;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   DGO v2.0 — Base typography + page chrome\n   ============================================================ */\n\n@import url(\"49b91855-540c-4b0d-a0ce-fa77d23d4297\");\n\nhtml, body {\n  font-family: var(--dgo-family-sans);\n  font-size: var(--dgo-type-body);\n  line-height: var(--dgo-lh-150);\n  color: var(--dgo-color-fg-default);\n  background: var(--dgo-color-surface-page);\n}\n\n/* Headings */\nh1, h2, h3, h4, h5, h6,\n.dgo-h1, .dgo-h2, .dgo-h3, .dgo-h4, .dgo-h5, .dgo-h6,\n.dgo-display, .dgo-display-xl, .dgo-display-xxl {\n  font-family: var(--dgo-family-display);\n  font-weight: var(--dgo-wt-700);\n  letter-spacing: var(--dgo-tr-tight);\n  line-height: var(--dgo-lh-120);\n  color: var(--dgo-color-fg-strong);\n  text-wrap: balance;\n}\n\n.dgo-display-xxl { font-size: var(--dgo-type-display-xxl); font-weight: var(--dgo-wt-800); letter-spacing: var(--dgo-tr-tightest); }\n.dgo-display-xl  { font-size: var(--dgo-type-display-xl);  font-weight: var(--dgo-wt-800); letter-spacing: var(--dgo-tr-tightest); }\n.dgo-display     { font-size: var(--dgo-type-display);     font-weight: var(--dgo-wt-700); letter-spacing: var(--dgo-tr-tight); }\nh1, .dgo-h1 { font-size: var(--dgo-type-h1); }\nh2, .dgo-h2 { font-size: var(--dgo-type-h2); }\nh3, .dgo-h3 { font-size: var(--dgo-type-h3); }\nh4, .dgo-h4 { font-size: var(--dgo-type-h4); }\nh5, .dgo-h5 { font-size: var(--dgo-type-body-lg); }\nh6, .dgo-h6 { font-size: var(--dgo-type-body); letter-spacing: var(--dgo-tr-wide); text-transform: uppercase; }\n\n/* Body */\np, .dgo-body { font-size: var(--dgo-type-body); line-height: var(--dgo-lh-150); text-wrap: pretty; }\n.dgo-body-lg { font-size: var(--dgo-type-body-lg); line-height: var(--dgo-lh-150); }\n.dgo-body-sm { font-size: var(--dgo-type-body-sm); line-height: var(--dgo-lh-140); }\n.dgo-caption { font-size: var(--dgo-type-caption); line-height: var(--dgo-lh-140); color: var(--dgo-color-fg-muted); }\n.dgo-overline {\n  font-size: var(--dgo-type-caption);\n  font-weight: var(--dgo-wt-600);\n  letter-spacing: var(--dgo-tr-widest);\n  text-transform: uppercase;\n  color: var(--dgo-color-fg-muted);\n}\n\na, .dgo-link {\n  color: var(--dgo-color-fg-link);\n  text-decoration: underline;\n  text-decoration-thickness: 1px;\n  text-underline-offset: 3px;\n  text-decoration-color: color-mix(in srgb, currentColor 40%, transparent);\n  transition: color var(--dgo-motion-state),\n              text-decoration-color var(--dgo-motion-state);\n}\na:hover, .dgo-link:hover {\n  color: var(--dgo-color-fg-link-hover);\n  text-decoration-color: currentColor;\n}\n\nstrong, b { font-weight: var(--dgo-wt-600); color: var(--dgo-color-fg-strong); }\nsmall { font-size: var(--dgo-type-caption); color: var(--dgo-color-fg-muted); }\n\ncode, kbd, samp, pre {\n  font-family: var(--dgo-family-mono);\n  font-size: 0.92em;\n}\n\n/* Selection */\n::selection {\n  background: color-mix(in srgb, var(--dgo-smart-400) 35%, transparent);\n  color: var(--dgo-color-fg-strong);\n}\n\n/* Accessibility utilities */\n.dgo-visually-hidden {\n  position: absolute !important;\n  width: 1px; height: 1px;\n  padding: 0; margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n\n.dgo-skip-link {\n  position: absolute;\n  inset-inline-start: var(--dgo-s-3);\n  inset-block-start: var(--dgo-s-3);\n  padding: var(--dgo-s-2) var(--dgo-s-3);\n  background: var(--dgo-color-surface-page);\n  color: var(--dgo-color-fg-link);\n  border: 2px solid var(--dgo-color-border-focus);\n  border-radius: var(--dgo-radius-control);\n  font-weight: var(--dgo-wt-600);\n  transform: translateY(-200%);\n  transition: transform var(--dgo-motion-state);\n  z-index: var(--dgo-z-toast);\n}\n.dgo-skip-link:focus { transform: translateY(0); }\n\n/* Print-friendly defaults */\n@media print {\n  body { background: #fff; color: #000; }\n  a { color: #000; text-decoration: underline; }\n  a[href^=\"http\"]::after { content: \" (\" attr(href) \")\"; font-size: 0.85em; }\n  .dgo-no-print { display: none !important; }\n}\n\n/* Container */\n.dgo-container {\n  width: 100%;\n  max-width: var(--dgo-c-wide);\n  margin-inline: auto;\n  padding-inline: var(--dgo-s-6);\n}\n.dgo-container--narrow  { max-width: var(--dgo-c-narrow); }\n.dgo-container--text    { max-width: var(--dgo-c-text); }\n.dgo-container--content { max-width: var(--dgo-c-content); }\n.dgo-container--full    { max-width: var(--dgo-c-full); }\n\n@media (max-width: 600px) {\n  .dgo-container { padding-inline: var(--dgo-s-4); }\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   DGO v2.0 — Layout primitives\n   stack · cluster · grid · sidebar · split\n   ============================================================ */\n\n/* Stack — vertical flow with consistent spacing */\n.dgo-stack { display: flex; flex-direction: column; gap: var(--dgo-density-gap); }\n.dgo-stack--1 { gap: var(--dgo-s-1); }\n.dgo-stack--2 { gap: var(--dgo-s-2); }\n.dgo-stack--3 { gap: var(--dgo-s-3); }\n.dgo-stack--4 { gap: var(--dgo-s-4); }\n.dgo-stack--5 { gap: var(--dgo-s-5); }\n.dgo-stack--6 { gap: var(--dgo-s-6); }\n.dgo-stack--8 { gap: var(--dgo-s-8); }\n.dgo-stack--12 { gap: var(--dgo-s-12); }\n\n/* Cluster — wrapping horizontal flow */\n.dgo-cluster {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: var(--dgo-density-gap);\n}\n.dgo-cluster--2 { gap: var(--dgo-s-2); }\n.dgo-cluster--3 { gap: var(--dgo-s-3); }\n.dgo-cluster--4 { gap: var(--dgo-s-4); }\n.dgo-cluster--end { justify-content: flex-end; }\n.dgo-cluster--between { justify-content: space-between; }\n\n/* Row — horizontal flex, non-wrapping by default */\n.dgo-row {\n  display: flex;\n  gap: var(--dgo-density-gap);\n  align-items: center;\n}\n.dgo-row--top    { align-items: flex-start; }\n.dgo-row--bottom { align-items: flex-end; }\n.dgo-row--baseline { align-items: baseline; }\n.dgo-row--stretch { align-items: stretch; }\n.dgo-row--between { justify-content: space-between; }\n.dgo-row--end     { justify-content: flex-end; }\n.dgo-row--center  { justify-content: center; }\n\n.dgo-spacer { flex: 1 1 auto; }\n\n/* Grid */\n.dgo-grid {\n  display: grid;\n  gap: var(--dgo-density-gap);\n}\n.dgo-grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n.dgo-grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }\n.dgo-grid--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }\n.dgo-grid--6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }\n.dgo-grid--12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }\n.dgo-grid--auto { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }\n\n@media (max-width: 900px) {\n  .dgo-grid--3, .dgo-grid--4, .dgo-grid--6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .dgo-grid--12 { grid-template-columns: repeat(4, minmax(0, 1fr)); }\n}\n@media (max-width: 600px) {\n  .dgo-grid--2, .dgo-grid--3, .dgo-grid--4, .dgo-grid--6 { grid-template-columns: 1fr; }\n  .dgo-grid--12 { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n}\n\n/* Sidebar layout — fixed-width sidebar + fluid content */\n.dgo-sidebar-layout {\n  display: grid;\n  grid-template-columns: var(--dgo-sidebar-w) minmax(0, 1fr);\n  min-height: 100vh;\n}\n.dgo-sidebar-layout--collapsed {\n  grid-template-columns: var(--dgo-sidebar-w-collapsed) minmax(0, 1fr);\n}\n\n@media (max-width: 900px) {\n  .dgo-sidebar-layout { grid-template-columns: 1fr; }\n}\n\n/* Split — two columns, prefer space-between */\n.dgo-split {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  gap: var(--dgo-s-4);\n}\n\n/* App shell scaffold */\n.dgo-app {\n  display: grid;\n  grid-template-rows: auto 1fr;\n  min-height: 100vh;\n}\n.dgo-app__topbar { grid-row: 1; }\n.dgo-app__body   { grid-row: 2; min-height: 0; }\n\n/* Container queries (component-level reflow) */\n.dgo-cq { container-type: inline-size; }\n<\u002Fstyle>\n<style>/* ============================================================\n   DGO Design System v2.0 — Component Library\n   ============================================================\n   Organised by family; BEM under `.dgo-` namespace.\n   Every value references a token — no hard-coded hex/px/ms.\n   ------------------------------------------------------------\n   Index:\n   1.  Button             7.  Pill / Badge / Tag      13. Sidebar\n   2.  Input / Textarea   8.  Avatar                  14. Topbar\n   3.  Select             9.  Card                    15. Tabs\n   4.  Checkbox / Radio   10. Alert / Banner          16. Breadcrumb\n   5.  Switch             11. Toast                   17. Stepper / Pagination\n   6.  Search             12. Modal / Drawer          18. Table / Data grid\n                          19. Tooltip / Popover       20. Menu / Dropdown\n                          21. Empty / Error state     22. Progress / Spinner\n                          23. Skeleton                24. Metric / Stat\n                          25. Kbd / Code              26. Chip / Filter bar\n   ============================================================ */\n\n@layer dgo-reset, dgo-base, dgo-component, dgo-utility;\n\n/* ============================================================\n   1 · BUTTON\n   ============================================================\n   States: default · hover · focus-visible · active · disabled · loading\n   Variants: primary · secondary · tertiary · ghost · danger\n   Sizes: sm · md · lg\n   ============================================================ */\n.dgo-btn {\n  --_h: var(--dgo-btn-h-md);\n  --_px: var(--dgo-btn-px-md);\n  --_fs: var(--dgo-type-body);\n\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--dgo-s-2);\n  block-size: var(--_h);\n  padding-inline: var(--_px);\n  font-family: var(--dgo-family-sans);\n  font-size: var(--_fs);\n  font-weight: var(--dgo-btn-fw);\n  line-height: 1;\n  border: 1px solid transparent;\n  border-radius: var(--dgo-btn-radius);\n  cursor: pointer;\n  user-select: none;\n  text-decoration: none;\n  white-space: nowrap;\n  transition:\n    background-color var(--dgo-motion-state),\n    border-color var(--dgo-motion-state),\n    color var(--dgo-motion-state),\n    box-shadow var(--dgo-motion-state),\n    transform var(--dgo-dur-instant) var(--dgo-ease-sharp);\n  min-inline-size: var(--_h); /* hit area floor */\n}\n\n.dgo-btn:focus-visible { box-shadow: var(--dgo-focus-ring); }\n.dgo-btn:active:not(:disabled) { transform: translateY(1px); }\n.dgo-btn:disabled,\n.dgo-btn[aria-disabled=\"true\"] {\n  opacity: 0.55;\n  cursor: not-allowed;\n  pointer-events: none;\n}\n\n.dgo-btn--sm { --_h: var(--dgo-btn-h-sm); --_px: var(--dgo-btn-px-sm); --_fs: var(--dgo-type-body-sm); }\n.dgo-btn--lg { --_h: var(--dgo-btn-h-lg); --_px: var(--dgo-btn-px-lg); --_fs: var(--dgo-type-body-lg); }\n.dgo-btn--block { inline-size: 100%; }\n\n/* Primary */\n.dgo-btn--primary {\n  background: var(--dgo-color-action-primary);\n  color: var(--dgo-color-fg-on-brand);\n}\n.dgo-btn--primary:hover:not(:disabled) { background: var(--dgo-color-action-primary-hover); box-shadow: var(--dgo-shadow-2); }\n.dgo-btn--primary:active:not(:disabled) { background: var(--dgo-color-action-primary-press); }\n\n/* Secondary — outline */\n.dgo-btn--secondary {\n  background: transparent;\n  color: var(--dgo-color-action-primary);\n  border-color: var(--dgo-color-border-strong);\n}\n.dgo-btn--secondary:hover:not(:disabled) {\n  border-color: var(--dgo-color-action-primary);\n  background: var(--dgo-color-action-secondary-hover);\n}\n.dgo-btn--secondary:active:not(:disabled) { background: var(--dgo-color-action-secondary-press); }\n\n/* Tertiary — text + subtle hover */\n.dgo-btn--tertiary,\n.dgo-btn--ghost {\n  background: transparent;\n  color: var(--dgo-color-action-primary);\n}\n.dgo-btn--tertiary:hover:not(:disabled),\n.dgo-btn--ghost:hover:not(:disabled) { background: var(--dgo-color-action-secondary-hover); }\n\n/* Danger */\n.dgo-btn--danger {\n  background: var(--dgo-color-action-danger);\n  color: var(--dgo-color-fg-on-brand);\n}\n.dgo-btn--danger:hover:not(:disabled) { background: var(--dgo-color-action-danger-hover); }\n\n/* Accent */\n.dgo-btn--accent {\n  background: var(--dgo-color-action-accent);\n  color: var(--dgo-color-fg-on-accent);\n}\n.dgo-btn--accent:hover:not(:disabled) { background: var(--dgo-color-action-accent-hover); }\n\n/* Icon button */\n.dgo-btn--icon { padding-inline: 0; inline-size: var(--_h); }\n\n/* Loading */\n.dgo-btn[data-loading=\"true\"] { color: transparent; position: relative; }\n.dgo-btn[data-loading=\"true\"]::after {\n  content: \"\";\n  position: absolute;\n  inline-size: 1em; block-size: 1em;\n  border: 2px solid currentColor;\n  border-block-start-color: transparent;\n  border-radius: 50%;\n  color: var(--dgo-color-fg-on-brand);\n  animation: dgo-spin 0.6s linear infinite;\n}\n.dgo-btn--secondary[data-loading=\"true\"]::after,\n.dgo-btn--tertiary[data-loading=\"true\"]::after,\n.dgo-btn--ghost[data-loading=\"true\"]::after { color: var(--dgo-color-action-primary); }\n\n@keyframes dgo-spin { to { transform: rotate(360deg); } }\n\n/* Button group */\n.dgo-btn-group { display: inline-flex; }\n.dgo-btn-group .dgo-btn {\n  border-radius: 0;\n}\n.dgo-btn-group .dgo-btn:first-child { border-start-start-radius: var(--dgo-btn-radius); border-end-start-radius: var(--dgo-btn-radius); }\n.dgo-btn-group .dgo-btn:last-child  { border-start-end-radius:   var(--dgo-btn-radius); border-end-end-radius:   var(--dgo-btn-radius); }\n.dgo-btn-group .dgo-btn + .dgo-btn { margin-inline-start: -1px; }\n\n/* ============================================================\n   2 · INPUT / TEXTAREA\n   ============================================================ */\n.dgo-input,\n.dgo-textarea,\n.dgo-select__field {\n  display: block;\n  inline-size: 100%;\n  block-size: var(--dgo-input-h);\n  padding-inline: var(--dgo-input-px);\n  padding-block: 0;\n  font-family: var(--dgo-family-sans);\n  font-size: var(--dgo-type-body);\n  color: var(--dgo-color-fg-default);\n  background: var(--dgo-input-bg);\n  border: 1px solid var(--dgo-input-border);\n  border-radius: var(--dgo-input-radius);\n  transition: border-color var(--dgo-motion-state), box-shadow var(--dgo-motion-state), background-color var(--dgo-motion-state);\n}\n.dgo-input::placeholder,\n.dgo-textarea::placeholder { color: var(--dgo-input-placeholder); }\n\n.dgo-input:hover:not(:disabled),\n.dgo-textarea:hover:not(:disabled),\n.dgo-select__field:hover:not(:disabled) { border-color: var(--dgo-input-border-hover); }\n\n.dgo-input:focus-visible,\n.dgo-textarea:focus-visible,\n.dgo-select__field:focus-visible {\n  outline: none;\n  border-color: var(--dgo-input-border-focus);\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--dgo-color-action-primary) 22%, transparent);\n}\n\n.dgo-input:disabled,\n.dgo-textarea:disabled,\n.dgo-select__field:disabled {\n  background: var(--dgo-input-bg-disabled);\n  color: var(--dgo-color-fg-disabled);\n  cursor: not-allowed;\n}\n\n.dgo-input[aria-invalid=\"true\"],\n.dgo-textarea[aria-invalid=\"true\"],\n.dgo-select__field[aria-invalid=\"true\"] { border-color: var(--dgo-input-border-error); }\n\n.dgo-textarea {\n  block-size: auto;\n  min-block-size: calc(var(--dgo-input-h) * 2.5);\n  padding-block: var(--dgo-s-2);\n  resize: vertical;\n  line-height: var(--dgo-lh-150);\n}\n\n/* Form field wrapper */\n.dgo-field { display: flex; flex-direction: column; gap: var(--dgo-s-1_5); }\n.dgo-field__label {\n  font-size: var(--dgo-type-body-sm);\n  font-weight: var(--dgo-wt-600);\n  color: var(--dgo-color-fg-default);\n}\n.dgo-field__label--req::after { content: \" *\"; color: var(--dgo-color-action-danger); }\n.dgo-field__help { font-size: var(--dgo-type-caption); color: var(--dgo-color-fg-muted); }\n.dgo-field__error {\n  font-size: var(--dgo-type-caption);\n  color: var(--dgo-color-danger-subtle-fg);\n  display: flex; align-items: center; gap: var(--dgo-s-1);\n}\n\n/* Input with leading/trailing affordance */\n.dgo-input-group {\n  display: flex; align-items: stretch;\n  border: 1px solid var(--dgo-input-border);\n  border-radius: var(--dgo-input-radius);\n  background: var(--dgo-input-bg);\n  overflow: hidden;\n}\n.dgo-input-group:focus-within {\n  border-color: var(--dgo-input-border-focus);\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--dgo-color-action-primary) 22%, transparent);\n}\n.dgo-input-group > .dgo-input,\n.dgo-input-group > .dgo-select__field {\n  border: \n.dgo-switch {\n  position: relative;\n  display: inline-flex;\n  inline-size: 38px; block-size: 22px;\n  border-radius: var(--dgo-r-pill);\n  background: var(--dgo-ink-200);\n  cursor: pointer;\n  transition: background-color var(--dgo-motion-state);\n  flex-shrink: 0;\n}\n.dgo-switch::before {\n  content: \"\";\n  position: absolute;\n  inset-inline-start: 2px;\n  inset-block-start: 2px;\n  inline-size: 18px; block-size: 18px;\n  border-radius: 50%;\n  background: var(--dgo-color-surface-page);\n  box-shadow: var(--dgo-shadow-1);\n  transition: transform var(--dgo-motion-state);\n}\n.dgo-switch input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }\n.dgo-switch:has(input:checked) { background: var(--dgo-color-action-primary); }\n.dgo-switch:has(input:checked)::before { transform: translateX(16px); }\n[dir=\"rtl\"] .dgo-switch:has(input:checked)::before { transform: translateX(-16px); }\n.dgo-switch:has(input:focus-visible) {\n  outline: 2px solid var(--dgo-color-border-focus);\n  outline-offset: 2px;\n}\n\n/* ============================================================\n   6 · SEARCH\n   ============================================================ */\n.dgo-search {\n  display: flex; align-items: center; gap: var(--dgo-s-2);\n  block-size: var(--dgo-input-h);\n  padding-inline: var(--dgo-s-3);\n  border: 1px solid var(--dgo-input-border);\n  border-radius: var(--dgo-input-radius);\n  background: var(--dgo-input-bg);\n  color: var(--dgo-color-fg-muted);\n  transition: border-color var(--dgo-motion-state);\n}\n.dgo-search:focus-within { border-color: var(--dgo-color-action-primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dgo-color-action-primary) 22%, transparent); }\n.dgo-search input {\n  flex: 1; border: 0; background: transparent;\n  font-size: var(--dgo-type-body);\n  color: var(--dgo-color-fg-default);\n  outline: none;\n}\n\n/* ============================================================\n   7 · PILL / BADGE / TAG / CHIP\n   ============ ap {\n  border: 1px solid var(--dgo-table-border);\n  border-radius: var(--dgo-radius-card);\n  overflow: clip;\n  background: var(--dgo-color-surface-raised);\n}\n.dgo-table {\n  inline-size: 100%;\n  border-collapse: collapse;\n  font-size: var(--dgo-type-body-sm);\n}\n.dgo-table thead { background: var(--dgo-table-header-bg); }\n.dgo-table th {\n  text-align: start;\n  padding: 0 var(--dgo-table-cell-px);\n  block-size: var(--dgo-table-row-h);\n  font-size: var(--dgo-type-caption);\n  font-weight: var(--dgo-wt-600);\n  letter-spacing: var(--dgo-tr-wide);\n  text-transform: uppercase;\n  color: var(--dgo-table-header-fg);\n  border-block-end: 1px solid var(--dgo-table-border);\n  white-space: nowrap;\n}\n.dgo-table td {\n  padding: 0 var(--dgo-table-cell-px);\n  block-size: var(--dgo-table-row-h);\n  color: var(--dgo-color-fg-default);\n  border-block-end: 1px solid var(--dgo-table-border);\n  vertical-align: middle;\n}\n.dgo-table tbody tr:hover td { background: var(--dgo-table-row-hover); }\n.dgo-table tbody tr:last-child td { border-block-end: 0; }\n.dgo-table--striped tbody tr:nth-child(even) td { background: var(--dgo-color-surface-sunken); }\n\n.dgo-table__num { text-align: end; font-variant-numeric: tabular-nums; }\n.dgo-table__sort {\n  display: inline-flex; align-items: center; gap: var(--dgo-s-1);\n  color: inherit; cursor: pointer;\n}\n\n/* ============================================================\n   19 · TOOLTIP / POPOVER\n   ============================================================ */\n.dgo-tooltip {\n  display: inline-block;\n  padding: 6px 10px;\n  background: var(--dgo-tooltip-bg);\n  color: var(--dgo-tooltip-fg);\n  font-size: var(--dgo-type-caption);\n  font-weight: var(--dgo-wt-500);\n  border-radius: var(--dgo-tooltip-radius);\n  box-shadow: var(--dgo-shadow-3);\n  max-inline-size: 280px;\n}\n.dgo-popover {\n  background: var(--dgo-color-surface-raised);\n  border: 1px solid var(--dgo-color-border-default);\n  border-radius: var(--dgo-po ===============================================\n   22 · PROGRESS / SPINNER\n   ============================================================ */\n.dgo-progress {\n  inline-size: 100%;\n  block-size: var(--dgo-progress-h);\n  background: var(--dgo-progress-track);\n  border-radius: var(--dgo-r-pill);\n  overflow: hidden;\n}\n.dgo-progress__fill {\n  block-size: 100%;\n  background: var(--dgo-progress-fill);\n  border-radius: inherit;\n  transition: inline-size var(--dgo-motion-state);\n}\n.dgo-progress--accent .dgo-progress__fill { background: var(--dgo-color-action-accent); }\n\n.dgo-progress-ring {\n  inline-size: 56px; block-size: 56px;\n  display: inline-grid; place-items: center;\n  --_p: 0;\n  background:\n    conic-gradient(var(--dgo-color-action-primary) calc(var(--_p) * 1%), var(--dgo-progress-track) 0);\n  border-radius: 50%;\n  font-size: var(--dgo-type-body-sm);\n  font-weight: var(--dgo-wt-700);\n  color: var(--dgo-color-fg-default);\n  position: relative;\n}\n.dgo-progress-ring::before {\n  content: \"\"; position: absolute; inset: 5px;\n  background: var(--dgo-color-surface-page);\n  border-radius: 50%;\n}\n.dgo-progress-ring > span { position: relative; }\n\n.dgo-spinner {\n  inline-size: 24px; block-size: 24px;\n  border: 2.5px solid var(--dgo-color-surface-sunken);\n  border-block-start-color: var(--dgo-color-action-primary);\n  border-radius: 50%;\n  animation: dgo-spin 0.8s linear infinite;\n}\n\n/* ============================================================\n   23 · SKELETON\n   ============================================================ */\n.dgo-skeleton {\n  display: block;\n  background:\n    linear-gradient(90deg,\n      var(--dgo-skeleton-base) 0%,\n      var(--dgo-skeleton-shine) 50%,\n      var(--dgo-skeleton-base) 100%);\n  background-size: 200% 100%;\n  border-radius: var(--dgo-r-6);\n  animation: dgo-skeleton 1.4s linear infinite;\n  min-block-size: 12px;\n}\n@keyframes dgo-skeleton {\n  from { background-position: 200% 0; }\n  to { background-position: -200% 0; }\n}\n.dgo-skeleton--circle { border-radius: 50%; }\n\n/* ============================================================\n   24 · METRIC / STAT TILE\n   ============================================================ */\n.dgo-metric {\n  background: var(--dgo-card-bg);\n  border: 1px solid var(--dgo-card-border);\n  border-radius: var(--dgo-card-radius);\n  padding: var(--dgo-card-pad);\n  display: flex; flex-direction: column; gap: var(--dgo-s-2);\n}\n.dgo-metric__label {\n  font-size: var(--dgo-type-caption);\n  font-weight: var(--dgo-wt-600);\n  letter-spacing: var(--dgo-tr-wide);\n  text-transform: uppercase;\n  color: var(--dgo-color-fg-muted);\n}\n.dgo-metric__value {\n  font-family: var(--dgo-family-display);\n  font-size: var(--dgo-type-h1);\n  font-weight: var(--dgo-wt-700);\n  letter-spacing: var(--dgo-tr-tightest);\n  line-height: var(--dgo-lh-110);\n  font-variant-numeric: tabular-nums;\n  color: var(--dgo-color-fg-strong);\n}\n.dgo-metric__delta {\n  display: inline-flex; align-items: center; gap: var(--dgo-s-1);\n  font-size: var(--dgo-type-body-sm);\n  font-weight: var(--dgo-wt-600);\n}\n.dgo-metric__delta--up { color: var(--dgo-color-success-subtle-fg); }\n.dgo-metric__delta--down { color: var(--dgo-color-danger-subtle-fg); }\n\n/* ============================================================\n   25 · KBD / CODE\n   ============================================================ */\n.dgo-kbd {\n  display: inline-flex; align-items: center;\n  min-inline-size: 22px; block-size: 22px;\n  padding-inline: 6px;\n  font-family: var(--dgo-family-mono);\n  font-size: 11px;\n  font-weight: var(--dgo-wt-600);\n  background: var(--dgo-kbd-bg);\n  color: var(--dgo-color-fg-default);\n  border: 1px solid var(--dgo-kbd-border);\n  border-block-end-width: 2px;\n  border-radius: var(--dgo-r-4);\n}\n\n.dgo-code-block {\n  display: block;\n  font-family: var(--dgo-family-mono);\n  font-size: var(--dgo-type-body-sm);\n  line-height: var(--dgo-lh-150); te.md §9).\n\n   Layer:        dgo-component\n   Namespace:    .dgo-cmdk* (BEM)\n   Depends on:   tokens/tokens.primitive.css\n                 tokens/tokens.semantic.css\n                 tokens/tokens.component.css      (--dgo-cmdk-* block)\n                 tokens/tokens.density.css\n                 styles/base.css                  (dgo-visually-hidden,\n                                                   focus-ring var)\n   No hard-coded colors, sizes, or durations — every value is a var().\n   ============================================================ */\n\n/* ------------------------------------------------------------\n   Backdrop + state machine\n   ------------------------------------------------------------ */\n.dgo-cmdk-backdrop {\n  position: fixed;\n  inset: 0;\n  z-index: var(--dgo-cmdk-z, var(--dgo-z-modal));\n  display: grid;\n  place-items: start center;\n  padding-block-start: 14vh;\n  padding-inline: var(--dgo-s-4);\n  background: var(--dgo-cmdk-backdrop-bg, var(--dgo-color-surface-overlay));\n  animation: dgo-fade-in var(--dgo-motion-enter);\n}\n.dgo-cmdk-backdrop[data-state=\"closed\"] { display: none; }\n.dgo-cmdk-backdrop[data-state=\"closing\"] { animation: dgo-fade-out var(--dgo-motion-exit) forwards; }\n\n/* ------------------------------------------------------------\n   Dialog\n   ------------------------------------------------------------ */\n.dgo-cmdk {\n  inline-size: 100%;\n  max-inline-size: var(--dgo-cmdk-w, clamp(320px, 90vw, 640px));\n  max-block-size: min(80vh, 720px);\n  display: flex;\n  flex-direction: column;\n  background: var(--dgo-cmdk-bg, var(--dgo-color-surface-raised));\n  border: 1px solid var(--dgo-cmdk-border, var(--dgo-color-border-default));\n  border-radius: var(--dgo-cmdk-radius, var(--dgo-radius-lg, var(--dgo-r-10)));\n  box-shadow: var(--dgo-cmdk-shadow, var(--dgo-elevation-modal, var(--dgo-shadow-5)));\n  overflow: clip;\n  animation: dgo-cmdk-in var(--dgo-motion-enter);\n}\n.dgo-cmdk-backdrop[data-state=\"closing\"] .dgo-cmdk {\n  animation: dgo-cmdk-out var(--dgo-motion-exit) forwards;\n}\n\n/* Inline variant — no backdrop, no focus trap, no animation */\n.dgo-cmdk--inline {\n  position: relative;\n  animation: none;\n  max-block-size: none;\n}\n\n/* ------------------------------------------------------------\n   Search row\n   ------------------------------------------------------------ */\n.dgo-cmdk__search {\n  display: flex;\n  align-items: center;\n  gap: var(--dgo-s-3);\n  padding-inline: var(--dgo-s-4);\n  block-size: var(--dgo-cmdk-input-h, 48px);\n  border-block-end: 1px solid var(--dgo-color-border-default);\n  background: var(--dgo-cmdk-input-bg, transparent);\n}\n.dgo-cmdk__search-icon {\n  flex: none;\n  inline-size: 20px; block-size: 20px;\n  color: var(--dgo-color-fg-muted);\n  fill: none; stroke: currentColor; stroke-width: 1.75;\n}\n.dgo-cmdk__input {\n  flex: 1 1 auto;\n  min-inline-size: 0;\n  block-size: 100%;\n  border: 0;\n  outline: 0;            /* the focus surface is the active descendant — see §10 */\n  background: transparent;\n  color: var(--dgo-color-fg-strong);\n  font-family: var(--dgo-family-ui, inherit);\n  font-size: var(--dgo-cmdk-input-fs, var(--dgo-type-body-lg));\n  line-height: var(--dgo-lh-130, 1.3);\n  caret-color: var(--dgo-color-action-primary);\n}\n.dgo-cmdk__input::placeholder {\n  color: var(--dgo-color-fg-subtle);\n  font-weight: var(--dgo-wt-400);\n}\n.dgo-cmdk__input::-webkit-search-cancel-button { display: none; }\n.dgo-cmdk__hint {\n  flex: none;\n  font-size: var(--dgo-size-12, 12px);\n  color: var(--dgo-color-fg-subtle);\n  font-family: var(--dgo-family-mono, ui-monospace, monospace);\n  letter-spacing: var(--dgo-tr-normal);\n  user-select: none;\n}\n\n/* ------------------------------------------------------------\n   Listbox\n   ------------------------------------------------------------ */\n.dgo-cmdk__listbox {\n  list-style: none;\n  margin: 0;\n  padding: var(--dgo-cmdk-pad, var(--dgo-s-2));\n  overflow-y: "logo-card\"><img src=\"d9d646fc-09ac-446b-aa89-55e2b9e84162\" alt=\"DGO endorsed by NITDA\"><\u002Fdiv>\n        <div class=\"logo-card logo-card--ink\">\n          <div style=\"color: #fff; text-align: center; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;\">\n            <div style=\"opacity: 0.6; margin-bottom: 4px;\">Construction<\u002Fdiv>\n            <svg width=\"120\" height=\"80\" viewBox=\"0 0 120 80\">\n              <g stroke=\"rgba(255,255,255,0.2)\" stroke-width=\"1\" stroke-dasharray=\"2 3\">\n                <line x1=\"0\" y1=\"20\" x2=\"120\" y2=\"20\"><\u002Fline>\n                <line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\"><\u002Fline>\n                <line x1=\"0\" y1=\"60\" x2=\"120\" y2=\"60\"><\u002Fline>\n                <line x1=\"30\" y1=\"0\" x2=\"30\" y2=\"80\"><\u002Fline>\n                <line x1=\"60\" y1=\"0\" x2=\"60\" y2=\"80\"><\u002Fline>\n                <line x1=\"90\" y1=\"0\" x2=\"90\" y2=\"80\"><\u002Fline>\n              <\u002Fg>\n              <circle cx=\"60\" cy=\"40\" r=\"18\" fill=\"none\" stroke=\"#17B255\" stroke-width=\"2.5\"><\u002Fcircle>\n              <circle cx=\"60\" cy=\"40\" r=\"5\" fill=\"#fff\"><\u002Fcircle>\n            <\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3>Endorsement lockup<\u002Fh3>\n      <div class=\"doc-panel\" style=\"display: flex; gap: var(--dgo-s-6); align-items: center; flex-wrap: wrap;\">\n        <p style=\"margin:0; max-width: 50ch; color: var(--dgo-color-fg-muted);\">Every official surface must carry the <code class=\"dgo-inline-code\">AN INITIATIVE OF NITDA<\u002Fcode> lockup. Clear space = 1× height of \"D\" in DGO.<\u002Fp>\n        <div class=\"endorsement-strip\"><span>An Initiative of NITDA<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n\n    <!-- ============= COLOR ============= -->\n    <section id=\"color\" class=\"doc-section\">\n      <h2>Color<\u002Fh2>\n      <p>Primary Deep Green i tion>\n\n\n    <!-- ============= ELEVATION ============= -->\n    <section id=\"elevation\" class=\"doc-section\">\n      <h2>Elevation<\u002Fh2>\n      <p>Green-tinted shadows so depth reads as part of the brand, not generic Material drop-shadow.<\u002Fp>\n      <div class=\"doc-panel\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--dgo-s-5); padding: var(--dgo-s-8);\">\n        <div style=\"background: #fff; height: 90px; border-radius: 10px; box-shadow: var(--dgo-shadow-1); display: grid; place-items: center; font-family: var(--dgo-family-mono); font-size: 11px;\">shadow-1<\u002Fdiv>\n        <div style=\"background: #fff; height: 90px; border-radius: 10px; box-shadow: var(--dgo-shadow-2); display: grid; place-items: center; font-family: var(--dgo-family-mono); font-size: 11px;\">shadow-2<\u002Fdiv>\n        <div style=\"background: #fff; height: 90px; border-radius: 10px; box-shadow: var(--dgo-shadow-3); display: grid; place-items: center; font-family: var(--dgo-family-mono); font-size: 11px;\">shadow-3<\u002Fdiv>\n        <div style=\"background: #fff; height: 90px; border-radius: 10px; box-shadow: var(--dgo-shadow-4); display: grid; place-items: center; font-family: var(--dgo-family-mono); font-size: 11px;\">shadow-4<\u002Fdiv>\n        <div style=\"background: #fff; height: 90px; border-radius: 10px; box-shadow: var(--dgo-shadow-5); display: grid; place-items: center; font-family: var(--dgo-family-mono); font-size: 11px;\">shadow-5<\u002Fdiv>\n        <div style=\"background: #fff; height: 90px; border-radius: 10px; box-shadow: var(--dgo-shadow-6); display: grid; place-items: center; font-family: var(--dgo-family-mono); font-size: 11px;\">shadow-6<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n\n    <!-- ============= MOTION ============= -->\n    <section id=\"motion\" class=\"doc-section\">\n      <h2>Motion<\u002Fh2>\n      <p>Five durations × five easings × choreography rules. Reduced-motion media query collapses everything ≤ 50ms.<\u002Fp>\n      <div class=\"doc-panel\">\n        <table class=\"dgo-table\">\n          <thead><tr><th>Token<\u002Fth><th>Value<\u002Fth><th>Use<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td><code class=\"dgo-inline-code\">--dgo-dur-instant<\u002Fcode><\u002Ftd><td class=\"dgo-table__num\">50ms<\u002Ftd><td>Press / micro-feedback<\u002Ftd><\u002Ftr>\n            <tr><td><code class=\"dgo-inline-code\">--dgo-dur-fast<\u002Fcode><\u002Ftd><td class=\"dgo-table__num\">150ms<\u002Ftd><td>Hover, exit transitions<\u002Ftd><\u002Ftr>\n            <tr><td><code class=\"dgo-inline-code\">--dgo-dur-base<\u002Fcode><\u002Ftd><td class=\"dgo-table__num\">250ms<\u002Ftd><td>State changes (default)<\u002Ftd><\u002Ftr>\n            <tr><td><code class=\"dgo-inline-code\">--dgo-dur-slow<\u002Fcode><\u002Ftd><td class=\"dgo-table__num\">400ms<\u002Ftd><td>Entrances (modal, toast)<\u002Ftd><\u002Ftr>\n            <tr><td><code class=\"dgo-inline-code\">--dgo-dur-deliberate<\u002Fcode><\u002Ftd><td class=\"dgo-table__num\">600ms<\u002Ftd><td>Hero, large traversals<\u002Ftd><\u002Ftr>\n            <tr><td><code class=\"dgo-inline-code\">--dgo-ease-standard<\u002Fcode><\u002Ftd><td class=\"dgo-table__num\">cubic-bezier(.2,0,0,1)<\u002Ftd><td>Default<\u002Ftd><\u002Ftr>\n            <tr><td><code class=\"dgo-inline-code\">--dgo-ease-entrance<\u002Fcode><\u002Ftd><td class=\"dgo-table__num\">cubic-bezier(0,0,.2,1)<\u002Ftd><td>Decel — element appears<\u002Ftd><\u002Ftr>\n            <tr><td><code class=\"dgo-inline-code\">--dgo-ease-exit<\u002Fcode><\u002Ftd><td class=\"dgo-table__num\">cubic-bezier(.4,0,1,1)<\u002Ftd><td>Accel — element leaves<\u002Ftd><\u002Ftr>\n            <tr><td><code class=\"dgo-inline-code\">--dgo-ease-emphasized<\u002Fcode><\u002Ftd><td class=\"dgo-table__num\">cubic-bezier(.2,0,0,1.2)<\u002Ftd><td>Hero, attention<\u002Ftd><\u002Ftr>\n            <tr><td><code class=\"dgo-inline-code\">--dgo-ease-sharp<\u002Fcode><\u002Ftd><td class=\"dgo-table__num\">cubic-bezier(.4,0,.6,1)<\u002Ftd><td>Quick state flips<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n\n    <!-- ============= ICONOGRAPHY ============= -->\n    <section id=\"icons\" class=\"doc-section\">\n      <h2>Iconography<\u002Fh2>\n      <p>1.5px stroke, square caps, mitre joins. 24px base. Inline SVG sprite — no runtime deps.<\u002Fp>\n      <div class=\"doc-panel\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: var(--dgo-s-3); color: var(--dgo-color-action-primary);\">\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: var(--dgo-family-mono); font-size: 10px; color: var(--dgo-color-fg-muted);\"><svg class=\"icon\"><use href=\"b3aa3f04-1df3-4e47-be12-707d6d29c77c#i-home\"><\u002Fuse><\u002Fsvg>home<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: var(--dgo-family-mono); font-size: 10px; color: var(--dgo-color-fg-muted);\"><svg class=\"icon\"><use href=\"b3aa3f04-1df3-4e47-be12-707d6d29c77c#i-grid\"><\u002Fuse><\u002Fsvg>grid<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: var(--dgo-family-mono); font-size: 10px; color: var(--dgo-color-fg-muted);\"><svg class=\"icon\"><use href=\"b3aa3f04-1df3-4e47-be12-707d6d29c77c#i-search\"><\u002Fuse><\u002Fsvg>search<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: var(--dgo-family-mono); font-size: 10px; color: var(--dgo-color-fg-muted);\"><svg class=\"icon\"><use href=\"b3aa3f04-1df3-4e47-be12-707d6d29c77c#i-filter\"><\u002Fuse><\u002Fsvg>filter<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: var(--dgo-family-mono); font-size: 10px; color: var(- gn-items: center; gap: 8px; font-family: var(--dgo-family-mono); font-size: 10px; color: var(--dgo-color-fg-muted);\"><svg class=\"icon\"><use href=\"b3aa3f04-1df3-4e47-be12-707d6d29c77c#i-shield\"><\u002Fuse><\u002Fsvg>shield<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: var(--dgo-family-mono); font-size: 10px; color: var(--dgo-color-fg-muted);\"><svg class=\"icon\"><use href=\"b3aa3f04-1df3-4e47-be12-707d6d29c77c#i-lock\"><\u002Fuse><\u002Fsvg>lock<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: var(--dgo-family-mono); font-size: 10px; color: var(--dgo-color-fg-muted);\"><svg class=\"icon\"><use href=\"b3aa3f04-1df3-4e47-be12-707d6d29c77c#i-user\"><\u002Fuse><\u002Fsvg>user<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: var(--dgo-family-mono); font-size: 10px; color: var(--dgo-color-fg-muted);\"><svg class=\"icon\"><use href=\"b3aa3f04-1df3-4e47-be12-707d6d29c77c#i-users\"><\u002Fuse><\u002Fsvg>users<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: var(--dgo-family-mono); font-size: 10px; color: var(--dgo-color-fg-muted);\"><svg class=\"icon\"><use href=\"b3aa3f04-1df3-4e47-be12-707d6d29c77c#i-settings\"><\u002Fuse><\u002Fsvg>settings<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: var(--dgo-family-mono); font-size: 10px; color: var(--dgo-color-fg-muted);\"><svg class=\"icon\"><use href=\"b3aa3f04-1df3-4e47-be12-707d6d29c77c#i-calendar\"><\u002Fuse><\u002Fsvg>calendar<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: var(--dgo-family-mono); font-size: 10px; color: var(--dgo-color-fg-muted);\"><svg class=\"icon\"><use href=\"b3aa3f04-1df3-4e47-be12-707d6d29c77c#i-c \n      <h2>Buttons<\u002Fh2>\n      <p>5 emphases × 3 sizes × full state matrix. 44px minimum hit area; 24px minimum CSS target on desktop.<\u002Fp>\n      <a class=\"doc-xref\" href=\"docs/components/button.md\">Full component contract <code>docs/components/button.md<\u002Fcode><\u002Fa>\n\n      <div class=\"demo-grid\">\n        <div class=\"demo\">\n          <div class=\"demo__stage\">\n            <button class=\"dgo-btn dgo-btn--primary\">Submit request<\u002Fbutton>\n            <button class=\"dgo-btn dgo-btn--secondary\">Cancel<\u002Fbutton>\n            <button class=\"dgo-btn dgo-btn--tertiary\">View details<\u002Fbutton>\n            <button class=\"dgo-btn dgo-btn--danger\">Delete record<\u002Fbutton>\n            <button class=\"dgo-btn dgo-btn--accent\"><svg class=\"icon-sm\"><use href=\"b3aa3f04-1df3-4e47-be12-707d6d29c77c#i-check\"><\u002Fuse><\u002Fsvg>Approve<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"demo__label\">Variants<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"demo\">\n          <div class=\"demo__stage\">\n            <button class=\"dgo-btn dgo-btn--primary dgo-btn--sm\">Small<\u002Fbutton>\n            <button class=\"dgo-btn dgo-btn--primary\">Default<\u002Fbutton>\n            <button class=\"dgo-btn dgo-btn--primary dgo-btn--lg\">Large<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"demo__label\">Sizes<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"demo\">\n          <div class=\"demo__stage\">\n            <button class=\"dgo-btn dgo-btn--primary\"><svg class=\"icon-sm\"><use href=\"b3aa3f04-1df3-4e47-be12-707d6d29c77c#i-plus\"><\u002Fuse><\u002Fsvg>New task<\u002Fbutton>\n            <button class=\"dgo-btn dgo-btn--secondary\"><svg class=\"icon-sm\"><use href=\"b3aa3f04-1df3-4e47-be12-707d6d29c77c#i-download\"><\u002Fuse><\u002Fsvg>Export CSV<\u002Fbutton>\n            <button class=\"dgo-btn dgo-btn--secondary dgo-btn--icon\" aria-label=\"More\"><svg class=\"icon-sm\"><use href=\"b3aa3f04-1df3-4e47-be12-707d6d29c77c#i-more\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"demo__label\">With icons<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"demo\">\n          <div class=\"demo__stage\">\n            <button class=\"dgo-btn dgo-btn--primary\" data-loading=\"true\">Saving<\u002Fbutton>\n            <button class=\"dgo-btn dgo-btn--secondary\" disabled=\"\">Disabled<\u002Fbutton>\n            <button class=\"dgo-btn dgo-btn--primary\" aria-disabled=\"true\">No access<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"demo__label\">Loading &amp; disabled<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"demo\">\n          <div class=\"demo__stage\">\n            <div class=\"dgo-btn-group\">\n              <button class=\"dgo-btn dgo-btn--secondary\">Day<\u002Fbutton>\n              <button class=\"dgo-btn dgo-btn--secondary\" style=\"background: var(--dgo-color-action-primary); color: #fff; border-color: var(--dgo-color-action-primary);\">Week<\u002Fbutton>\n              <button class=\"dgo-btn dgo-btn--secondary\">Month<\u002Fbutton>\n              <button class=\"dgo-btn dgo-btn--secondary\">Quarter<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"demo__label\">Button group<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n\n    <!-- ============= FORMS ============= -->\n    <section id=\"forms\" class=\"doc-section\">\n      <h2>Form controls<\u002Fh2>\n      <a class=\"doc-xref\" href=\"docs/components/input.md\">Full component contract <code>docs/components/input.md<\u002Fcode><\u002Fa>\n\n      <div class=\"demo-grid\">\n        <div class=\"demo\">\n          <div class=\"demo__stage\" style=\"display: block;\">\n            <div class=\"dgo-stack dgo-stack--4\">\n              <div class=\"dgo-field\">\n                <label class=\"dgo-field__label dgo-field__label--req\" for=\"t1\">Full name<\u002Flabel>\n                <input id=\"t1\" class=\"dgo-input\" placeholder=\"As shown on ID\" value=\"Adamu Bello\">\n                <span class=\"dgo-field__help\">First name, middle name, surname<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"dgo-field\">\n                <label class=\"dgo-field__label\" for=\"t2\">Email<\u002Flabel>\n                <input id=\"t2\" class=\"dgo-input\" placeholder=\"name@agency.gov.ng\">\n              <\u002Fdiv>\n              <div class=\"dgo-field\">\n                <label class=\"dgo-field__label\" for=\"t3\">Phone<\u002Flabel>\n                <div class=\"dgo-input-group\">\n                  <span class=\"dgo-input-group__addon\">+234<\u002Fspan>\n                  <input id=\"t3\" class=\"dgo-input\" placeholder=\"803 000 0000\">\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"demo__label\">Inputs<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"demo\">\n          <div class=\"demo__stage\" style=\"display: block;\">\n            <div class=\"dgo-stack dgo-stack--4\">\n              <div class=\"dgo-field\">\n                <label class=\"dgo-field__label\" for=\"t4\">Division<\u002Flabel>\n                <div class=\"dgo-select\">\n                  <select id=\"t4\" class=\"dgo-select__field\">\n                    <option>Office of the Director-General<\u002Foption>\n                    <option>Finance &amp; Accounts<\u002Foption>\n                    <option>IT Infrastructure Solutions<\u002Foption>\n                    <option>SERVICOM<\u002Foption>\n                  <\u002Fselect>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"dgo-field has-error\">\n                <label class=\"dgo-field__label\" for=\"t5\">NIN<\u002Flabel>\n                <input id=\"t5\" class=\"dgo-input\" aria-invalid=\"true\" value=\"1234\">\n                <span class=\"dgo-field__error\">National Id
