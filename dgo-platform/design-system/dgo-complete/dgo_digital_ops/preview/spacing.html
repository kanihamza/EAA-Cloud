<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Spacing Scale" subtitle="4px increments, 1–12 scale" -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing Scale</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    body {
      margin: 0;
      padding: 32px;
      font-family: var(--dgo-font-body);
      background: white;
    }
    .space-item {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    .space-label {
      font-family: var(--dgo-font-mono);
      font-size: 11px;
      color: var(--dgo-ink-500);
      width: 140px;
    }
    .space-visual {
      height: 24px;
      background: var(--dgo-accent);
      border-radius: 2px;
    }
  </style>
</head>
<body class="dgo">
  <h2 style="margin: 0 0 16px 0; font-size: 18px;">Spacing Scale (4px increments)</h2>
  
  <div class="space-item">
    <div class="space-label">--dgo-space-1 (4px)</div>
    <div class="space-visual" style="width: 4px;"></div>
  </div>
  <div class="space-item">
    <div class="space-label">--dgo-space-2 (8px)</div>
    <div class="space-visual" style="width: 8px;"></div>
  </div>
  <div class="space-item">
    <div class="space-label">--dgo-space-3 (12px)</div>
    <div class="space-visual" style="width: 12px;"></div>
  </div>
  <div class="space-item">
    <div class="space-label">--dgo-space-4 (16px)</div>
    <div class="space-visual" style="width: 16px;"></div>
  </div>
  <div class="space-item">
    <div class="space-label">--dgo-space-5 (20px)</div>
    <div class="space-visual" style="width: 20px;"></div>
  </div>
  <div class="space-item">
    <div class="space-label">--dgo-space-6 (24px)</div>
    <div class="space-visual" style="width: 24px;"></div>
  </div>
  <div class="space-item">
    <div class="space-label">--dgo-space-7 (32px)</div>
    <div class="space-visual" style="width: 32px;"></div>
  </div>
  <div class="space-item">
    <div class="space-label">--dgo-space-8 (40px)</div>
    <div class="space-visual" style="width: 40px;"></div>
  </div>
  <div class="space-item">
    <div class="space-label">--dgo-space-9 (48px)</div>
    <div class="space-visual" style="width: 48px;"></div>
  </div>
  <div class="space-item">
    <div class="space-label">--dgo-space-10 (64px)</div>
    <div class="space-visual" style="width: 64px;"></div>
  </div>
</body>
</html>
