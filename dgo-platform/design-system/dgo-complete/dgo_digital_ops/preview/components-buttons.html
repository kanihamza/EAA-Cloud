<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Buttons" subtitle="5 variants, 3 sizes, icon support" -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttons</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../components.css">
  <style>
    body {
      margin: 0;
      padding: 32px;
      font-family: var(--dgo-font-body);
      background: white;
    }
    .row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    h3 {
      margin: 24px 0 12px 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--dgo-ink-900);
    }
    h3:first-child {
      margin-top: 0;
    }
  </style>
</head>
<body class="dgo">
  <h3>Variants</h3>
  <div class="row">
    <button class="dgo-btn dgo-btn-primary">Primary</button>
    <button class="dgo-btn dgo-btn-secondary">Secondary</button>
    <button class="dgo-btn dgo-btn-ghost">Ghost</button>
    <button class="dgo-btn dgo-btn-danger">Danger</button>
    <button class="dgo-btn dgo-btn-success">Success</button>
  </div>

  <h3>Sizes</h3>
  <div class="row">
    <button class="dgo-btn dgo-btn-primary dgo-btn-sm">Small</button>
    <button class="dgo-btn dgo-btn-primary">Default</button>
    <button class="dgo-btn dgo-btn-primary dgo-btn-lg">Large</button>
  </div>

  <h3>States</h3>
  <div class="row">
    <button class="dgo-btn dgo-btn-primary">Normal</button>
    <button class="dgo-btn dgo-btn-primary" disabled>Disabled</button>
  </div>

  <h3>With Icons</h3>
  <div class="row">
    <button class="dgo-btn dgo-btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Create Task
    </button>
    <button class="dgo-btn dgo-btn-secondary">
      Download
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
      </svg>
    </button>
  </div>
</body>
</html>
