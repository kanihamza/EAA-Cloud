<!DOCTYPE html>
<!-- @dsCard group="Brand" name="DGO Logo" subtitle="Horizontal, white-out, and mark-only variants" -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DGO Logo</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    body {
      margin: 0;
      padding: 32px;
      font-family: var(--dgo-font-body);
      background: white;
    }
    .logo-grid {
      display: grid;
      gap: 24px;
    }
    .logo-item {
      padding: 24px;
      border: 1px solid var(--dgo-border);
      border-radius: var(--dgo-radius-md);
      text-align: center;
    }
    .logo-item.dark {
      background: var(--dgo-primary);
    }
    .logo-item p {
      margin: 12px 0 0 0;
      font-size: 12px;
      color: var(--dgo-ink-500);
    }
    .logo-item.dark p {
      color: rgba(255,255,255,0.7);
    }
  </style>
  <template id="__bundler_thumbnail" data-bg-color="#FFFFFF">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#FFFFFF"/>
      <g transform="translate(600 360)">
        <circle r="150" fill="none" stroke="#17B255" stroke-width="22"/>
        <circle r="36" fill="#05583B"/>
      </g>
      <text x="600" y="660" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-size="92" font-weight="800" fill="#05583B" letter-spacing="-3">DGO</text>
      <text x="600" y="710" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#5F5C5D" letter-spacing="8">DIGITAL OPS</text>
    </svg>
  </template>
</head>
<body class="dgo">
  <h2 style="margin: 0 0 16px 0; font-size: 18px;">DGO Digital Ops Logo</h2>
  
  <div class="logo-grid">
    <div class="logo-item">
      <svg width="200" height="40" viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <text x="0" y="30" font-family="Outfit, sans-serif" font-size="33" font-weight="800" fill="#05583B" letter-spacing="-0.66">DG</text>
        <circle cx="86" cy="20" r="11.5" stroke="#17B255" stroke-width="2" fill="none"/>
        <circle cx="86" cy="20" r="3" fill="#05583B"/>
        <text x="0" y="39" font-family="Outfit, sans-serif" font-size="7.5" font-weight="600" fill="#5F5C5D" letter-spacing="1.3">DIGITAL OPS</text>
      </svg>
      <p>Horizontal Primary</p>
    </div>

    <div class="logo-item dark">
      <svg width="200" height="40" viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <text x="0" y="30" font-family="Outfit, sans-serif" font-size="33" font-weight="800" fill="#FFFFFF" letter-spacing="-0.66">DG</text>
        <circle cx="86" cy="20" r="11.5" stroke="#17B255" stroke-width="2" fill="none"/>
        <circle cx="86" cy="20" r="3" fill="#FFFFFF"/>
        <text x="0" y="39" font-family="Outfit, sans-serif" font-size="7.5" font-weight="600" fill="rgba(255,255,255,0.7)" letter-spacing="1.3">DIGITAL OPS</text>
      </svg>
      <p>White-out on Deep Green</p>
    </div>

    <div class="logo-item">
      <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="30" cy="30" r="21" stroke="#17B255" stroke-width="3" fill="none"/>
        <circle cx="30" cy="30" r="5" fill="#05583B"/>
      </svg>
      <p>Mark Only (Atomic O)</p>
    </div>
  </div>
</body>
</html>
